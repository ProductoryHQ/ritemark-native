name: Extension tests

# The extension's automatic tests: 469 test files, one or more per feature (decks, AI chat,
# dictation, Flows, publishing, search, Excel and the other viewers, ...). Each checks that a
# feature still does what it should, so a change in one place can't quietly break another.
# They run here on every PR that touches the extension and on every merge to main, on a
# macOS arm64 runner (dictation and Quick Look are Mac-only; standard runners are free on this
# public repo), not on a developer's machine. A PR merges only when this check is green.

on:
  pull_request:
    paths:
      - 'extensions/ritemark/**'
      - '.github/workflows/extension-tests.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/ritemark/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: extension-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-chain:
    name: npm test (extension)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Ritemark
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.22.1
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.1'

      - name: Install extension dependencies
        working-directory: extensions/ritemark
        run: npm ci --legacy-peer-deps

      - name: Install webview dependencies
        working-directory: extensions/ritemark/webview
        run: npm ci --legacy-peer-deps

      - name: Type-check the extension
        working-directory: extensions/ritemark
        run: npx tsc --noEmit -p ./

      - name: Run the full test chain
        working-directory: extensions/ritemark
        run: npm test > "$RUNNER_TEMP/npm-test.log" 2>&1

      - name: Show the failing lines
        if: failure()
        run: |
          { grep -nE "not ok|Error|FAIL|✖" "$RUNNER_TEMP/npm-test.log" | head -60; echo '--- last lines ---'; tail -30 "$RUNNER_TEMP/npm-test.log"; } > "$RUNNER_TEMP/failing.txt" || true
          cat "$RUNNER_TEMP/failing.txt"

      # Red main is never silent: one open issue labelled test-chain-red carries the failing
      # lines and the merge that turned it red. The Development manager fixes it forward first,
      # and no RC is cut while it is open. A green run closes it.
      - name: Open or update the red-chain issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create test-chain-red --color B60205 --description "Extension tests failed on main" 2>/dev/null || true
          {
            echo "The extension tests failed on \`main\` at \`${GITHUB_SHA::8}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
            echo; echo "**The merge:** $(git log -1 --format='%h %s')"
            echo; echo "**Failing lines:**"; echo; echo '```'; head -c 60000 "$RUNNER_TEMP/failing.txt"; echo '```'
          } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --label test-chain-red --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "Extension tests are red on main" --label test-chain-red --body-file "$RUNNER_TEMP/body.md"; fi

      - name: Close the red-chain issue
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label test-chain-red --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Green again at \`${GITHUB_SHA::8}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-log
          path: ${{ runner.temp }}/npm-test.log
          retention-days: 14
