name: Deck file type proof (macOS)

# Sprint 172 (#940): proves on a real macOS what Finder does with a `.rtms`
# file once a bundle stamped by scripts/stamp-deck-document-type.sh is
# installed: the kind "Ritemark Deck", the system's page with the deck badge
# and DECK, Ritemark as the opener, Quick Look's text and Spotlight's words.
#
# WHY a runner: all of that needs LaunchServices to register a bundle that
# claims the type. That must never happen on a person's Mac with a dev or test
# build, so it happens here, on an ephemeral runner that is thrown away after
# the job. The stand-in bundle is an Info.plist shaped like the release
# build's, a copy of /usr/bin/true as its executable, and the badge; the same
# stamp script the release builds run turns it into the deck's owner.
#
# SCOPE: harness only, not a `build-` workflow. It builds no app and ships
# nothing. Dispatch it by hand (gh workflow run deck-type-proof.yml --ref <ref>)
# when the stamp script, the badge or this proof changes. On the free standard
# macOS runner of this public repository; a run takes a few minutes.

on:
  workflow_dispatch:
  # Sprint 172 PR 2 only: a workflow_dispatch workflow can be dispatched only
  # once it is on the default branch, so the first proof runs on pushes to the
  # PR's branch. Removed before the PR merges.
  push:
    branches: [sprint-172-deck-extension-pr2]
    paths:
      - .github/workflows/deck-type-proof.yml
      - scripts/qa/deck-type-proof.swift
      - scripts/stamp-deck-document-type.sh
      - branding/icons/deck-badge.car

permissions:
  contents: read

concurrency:
  group: deck-type-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      APP: /Applications/Ritemark.app
      WORK: ${{ github.workspace }}/deck-proof-files
      PROOF: ${{ github.workspace }}/deck-proof
      LSREGISTER: /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make a stand-in Ritemark bundle
        run: |
          set -euo pipefail
          sw_vers
          mkdir -p "$PROOF" "$WORK"
          sudo rm -rf "$APP"
          sudo mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          sudo chown -R "$(id -un)" "$APP"
          cp /usr/bin/true "$APP/Contents/MacOS/Ritemark"
          cp branding/icons/icon.icns "$APP/Contents/Resources/Ritemark.icns"
          # Shaped like the release build's plist: the bundle id from
          # branding/product.json, the app icon file and upstream's Markdown
          # document type.
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>ai.productory.ritemark</string>
            <key>CFBundleName</key><string>Ritemark</string>
            <key>CFBundleDisplayName</key><string>Ritemark</string>
            <key>CFBundleExecutable</key><string>Ritemark</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Ritemark.icns</string>
            <key>CFBundleShortVersionString</key><string>2.3.0</string>
            <key>CFBundleVersion</key><string>2.3.0</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>Markdown document</string>
                <key>CFBundleTypeRole</key><string>Editor</string>
                <key>CFBundleTypeExtensions</key><array><string>md</string><string>markdown</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

      - name: Stamp it with the release script
        run: ./scripts/stamp-deck-document-type.sh "$APP"

      - name: Keep the stamped plist
        run: |
          plutil -convert xml1 -o "$PROOF/Info.plist" "$APP/Contents/Info.plist"
          ./scripts/stamp-deck-document-type.sh --check "$APP" | tee "$PROOF/stamp-check.txt"

      - name: Sign it ad hoc (the stamped plist must sign)
        run: |
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | tee "$PROOF/codesign-verify.txt"

      - name: Register it with LaunchServices (this runner only)
        run: |
          "$LSREGISTER" -f "$APP"
          sleep 3
          { "$LSREGISTER" -dump 2>/dev/null || true; } > "$WORK/lsregister-dump.txt"
          grep -n -B4 -A30 'ai.productory.ritemark.deck' "$WORK/lsregister-dump.txt" > "$PROOF/lsregister-deck.txt" || true
          wc -l "$PROOF/lsregister-deck.txt"

      - name: Make a deck and a Markdown file
        run: |
          cat > "$WORK/Day one.rtms" <<'DECK'
          ---
          title: Day one
          ---

          # Welcome to the workshop

          Bring a question you care about.

          ---

          # The agenda

          - Morning: the customer interview
          - Afternoon: the journey map
          DECK
          printf '# Notes\n\nA plain Markdown file.\n' > "$WORK/notes.md"

      - name: Ask macOS about the type, the opener and the icon
        run: |
          set -o pipefail
          swift scripts/qa/deck-type-proof.swift "$WORK/Day one.rtms" "$WORK/notes.md" "$PROOF" | tee "$PROOF/report.txt"

      - name: Quick Look thumbnail
        if: always()
        run: |
          qlmanage -t -s 512 -o "$PROOF" "$WORK/Day one.rtms" > "$PROOF/qlmanage.txt" 2>&1 || true
          cat "$PROOF/qlmanage.txt"
          ls -la "$PROOF"

      - name: Spotlight's importer
        if: always()
        run: |
          mdimport -t -d3 "$WORK/Day one.rtms" > "$PROOF/mdimport.txt" 2>&1 || true
          grep -nE 'Imported|importer|kMDItemContentType|kMDItemKind|journey|customer|workshop' "$PROOF/mdimport.txt" | head -40 || true

      - name: Finder window (best effort)
        if: always()
        run: |
          open -R "$WORK/Day one.rtms" || true
          sleep 5
          screencapture -x "$PROOF/finder-screen.png" || true

      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deck-type-proof
          path: deck-proof/
          retention-days: 30
