name: Build Windows (x64)

on:
  workflow_dispatch:
    # This paid larger-runner workflow stays manual and always produces a
    # fully signed installer. Missing credentials or any unsigned PE fails it.

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.1'
  WINDOWS_PUBLISHER: 'Productory Services OÜ'

jobs:
  build:
    runs-on: windows-8core
    timeout-minutes: 120

    steps:
      - name: Configure Git for Windows
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout RiteMark
        uses: actions/checkout@v4
        with:
          path: r
          fetch-depth: 0
          submodules: true

      - name: Verify canonical release source
        shell: bash
        working-directory: r
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          ./scripts/verify-release-source.sh --target win32-x64 --phase pristine

      - name: Require signing credentials
        id: release
        shell: pwsh
        working-directory: r
        env:
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content branding/product.json -Raw | ConvertFrom-Json).ritemarkVersion
          foreach ($name in 'AZURE_SIGNING_TENANT_ID','AZURE_SIGNING_CLIENT_ID','AZURE_SIGNING_CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Required repository secret $name is missing."
            }
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch bundled agent runtimes (win32-x64)
        # Sprint 64 Phase D: materialise app-owned Codex + Claude binaries into
        # extensions/ritemark/binaries/agents/win32-x64/ BEFORE the extension is
        # copied into vscode/extensions/ritemark. The fetch script is
        # idempotent via per-binary .sha256 sidecars — re-runs are cheap and
        # verify integrity. Job fails fast if checksums don't match the
        # manifest.
        shell: bash
        working-directory: r
        run: ./scripts/fetch-agent-runtimes.sh --platform win32 --arch x64

      - name: Copy extension (replace symlink)
        shell: bash
        working-directory: r
        run: |
          # Build a target-only physical copy without mutating tracked source.
          # The copier filters macOS dylib symlinks before traversal, so it is
          # safe under Git Bash without Windows symlink privileges.
          node ./scripts/copy-extension-for-target.mjs \
            --source extensions/ritemark \
            --destination vscode/extensions/ritemark \
            --target win32-x64

      - name: Patch bundled node-gyp for VS2026 detection
        # DRIFT-PREVENTION: .github/workflows/windows-canary.yml runs a copy of
        # this node-gyp patch + VS-detection logic weekly on the free
        # windows-latest runner as an early-warning. If you change the node-gyp
        # pin or VS-detection logic here, update windows-canary.yml too.
        #
        # windows-8core now ships Visual Studio 2026 (internal major version
        # 18) instead of/alongside VS 2022. node-gyp 11.2.0 (bundled with this
        # runner's Node 22.22.1) only recognises major versions 15/16/17 ->
        # 2017/2019/2022 and silently drops anything newer, so every native
        # module build fails with "Could not find any Visual Studio
        # installation to use" (@parcel/watcher hits it first). node-gyp
        # 12.0.0 (2026-01-27) added the 18 -> 2026 mapping (still present in
        # 13.x). Using 12.4.0, NOT 13.x: node-gyp 13.0.1 requires Node
        # `^22.22.2 || ^24.15.0 || >=26.0.0`, and this runner is pinned to
        # 22.22.1 -- one patch below that floor. 12.4.0 only requires
        # `^20.17.0 || >=22.9.0` (satisfied) and already has the same VS2026
        # fix, confirmed by diffing its find-visualstudio.js.
        #
        # Setting npm_config_node_gyp as a plain env var does NOT work here:
        # during `npm ci`'s automatic native-module rebuild, @npmcli/arborist's
        # rebuild.js builds its own narrow env object for lifecycle scripts
        # (just npm_package_* keys) instead of forwarding process.env, so
        # @npmcli/run-script's make-spawn-args.js never sees the override and
        # falls back to `require.resolve('node-gyp/bin/node-gyp.js')` — i.e.
        # whichever node-gyp is physically bundled inside npm's own install
        # tree. So patch that file in place instead, at the exact path
        # confirmed from the failing runs' own logs (node.exe's sibling
        # node_modules/npm on the official Windows Node distribution layout).
        #
        # A plain `npm install node-gyp@12.4.0` run *inside* npm's own
        # directory 404s (confirmed locally): npm's package.json is a
        # workspace-style manifest with internal-only devDependencies
        # (@npmcli/docs) that aren't independently installable. So build a
        # fully self-contained node-gyp@12.4.0 in an isolated staging project
        # instead (--install-strategy=nested nests every dependency inside
        # node-gyp's own node_modules rather than hoisting into the staging
        # root), then drop that whole folder into place -- npm's other hoisted
        # sibling packages are never touched. Verified locally (staged install
        # + version check + a require() smoke test of find-visualstudio.js)
        # before ever running this on CI. The VS-detection check below then
        # confirms the real code path so a wrong layout assumption fails in
        # seconds, not after a full ~9-minute npm ci cycle.
        #
        # VS Code's OWN build/npm/preinstall.ts does a SEPARATE, independent
        # compiler-toolchain check (unrelated to node-gyp): it hardcodes
        # `Microsoft Visual Studio\2022` / `\2019` folder-name lookups and
        # throws "Invalid C/C++ Compiler Toolchain" if neither exists. VS2026
        # lives at `...\Visual Studio\18\...`, so that check also needs a
        # nudge -- preinstall.ts itself documents the fix: a `vs2022_install`
        # env var that bypasses the hardcoded path via fs.existsSync. Emit the
        # path node-gyp just found as a step output so the next step can wire
        # it up without re-deriving it.
        id: node-gyp-patch
        shell: bash
        run: |
          set -e
          NODE_DIR="$(dirname "$(command -v node)")"
          NPM_DIR="$NODE_DIR/node_modules/npm"
          NODE_GYP_DIR="$NPM_DIR/node_modules/node-gyp"
          NODE_GYP_JS="$NODE_GYP_DIR/bin/node-gyp.js"
          echo "Node dir: $NODE_DIR"
          echo "npm install dir: $NPM_DIR"

          if [ ! -f "$NODE_GYP_JS" ]; then
            echo "::error::Expected bundled node-gyp not found at $NODE_GYP_JS -- runner layout assumption is wrong, aborting before an npm ci cycle."
            exit 1
          fi
          echo "Before patch: $(node "$NODE_GYP_JS" --version)"

          STAGING="$RUNNER_TEMP/node-gyp-staging"
          mkdir -p "$STAGING"
          ( cd "$STAGING" && npm init -y --silent >/dev/null && npm install node-gyp@12.4.0 --install-strategy=nested --save-exact --no-audit --no-fund --loglevel=error )

          rm -rf "$NODE_GYP_DIR"
          cp -R "$STAGING/node_modules/node-gyp" "$NODE_GYP_DIR"

          PATCHED_VERSION="$(node "$NODE_GYP_JS" --version)"
          echo "After patch: $PATCHED_VERSION"
          if [ "$PATCHED_VERSION" != "v12.4.0" ]; then
            echo "::error::node-gyp patch did not take effect (got '$PATCHED_VERSION', expected v12.4.0)"
            exit 1
          fi

          cat > "$RUNNER_TEMP/check-vs.js" <<'EOF'
          const path = require('path')
          const fs = require('fs')
          const gypDir = process.argv[2]
          const { findVisualStudio } = require(path.join(gypDir, 'lib', 'find-visualstudio.js'))
          const nodeSemver = { major: parseInt(process.versions.node.split('.')[0], 10) }
          findVisualStudio(nodeSemver, undefined).then((info) => {
            console.log('VS2026 detection OK:', JSON.stringify(info, null, 2))
            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `vs_path=${info.path}\n`)
            }
          }).catch((err) => {
            console.error('VS2026 detection FAILED:', err.message)
            process.exit(1)
          })
          EOF
          node "$RUNNER_TEMP/check-vs.js" "$NODE_GYP_DIR"

      - name: Skip native builds for bundled copilot extension
        # extensions/copilot (GitHub Copilot Chat, built into VS Code 1.117) is
        # STRIPPED entirely from the final Ritemark app -- see the later
        # "Strip bundled copilot extension from output" step. We never ship its
        # native modules.
        #
        # Its transitive deps `keytar` and `@keyv/sqlite`->`sqlite3` are native
        # addons. copilot's OWN lockfile pins `node-gyp@10.3.1` locally
        # (extensions/copilot/node_modules/node-gyp), so their install scripts
        # (`prebuild-install || node-gyp rebuild`) PATH-resolve node-gyp to that
        # local copy -- which shadows the VS2026-aware node-gyp@12.4.0 we patch
        # into npm globally and, like 11.2.0, cannot map VC++ major 18 -> VS2026.
        # Result: "Could not find any Visual Studio installation to use", the
        # ONLY fatal failure once Layers 1+2 are in place (build/remote already
        # compile fine under VS2026 via npm's global patched node-gyp; ssh2's
        # optional openssl-dependent crypto binding fails non-fatally and is
        # unrelated).
        #
        # We can't drop the copilot extension (gulp's
        # prepareBuiltInCopilotExtensionShims hard-requires the dir), and env-var
        # node-gyp overrides don't reach this arborist-driven `npm ci` lifecycle
        # path (proven in the node-gyp patch step's own comment). Since copilot's
        # native modules are never shipped, skip its install scripts entirely.
        # This is safe for the build: keytar/sqlite3 are esbuild EXTERNALS in
        # copilot's .esbuild.ts (never bundled at compile time), and copilot's
        # compile re-runs its own script/postinstall.ts (which only COPIES
        # prebuilt @vscode/tree-sitter-wasm .wasm / tiktoken / @github/copilot CLI
        # assets -- no node-gyp, no build-wasm). @github/copilot (needed by the
        # gulp shim) has no install script, so its sdk/ tarball contents are
        # unaffected.
        shell: bash
        working-directory: r/vscode
        run: |
          echo "ignore-scripts=true" >> extensions/copilot/.npmrc
          echo "extensions/copilot/.npmrc is now:"
          cat extensions/copilot/.npmrc

      - name: Install VS Code dependencies
        shell: bash
        working-directory: r/vscode
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force node-gyp to use the setup-python 3.11 interpreter instead of
          # whatever is first on PATH. The runner image now ships Python 3.14.5,
          # which node-gyp auto-selects and which breaks native module builds.
          # NODE_GYP_FORCE_PYTHON is the authoritative node-gyp 11 override
          # (npm_config_python is no longer honoured as of npm 9).
          NODE_GYP_FORCE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          # See the "Patch bundled node-gyp" step: VS Code's own
          # build/npm/preinstall.ts only recognises Visual Studio 2022/2019 by
          # folder name and throws "Invalid C/C++ Compiler Toolchain"
          # otherwise. Point its documented override at the VS2026 install
          # node-gyp just found.
          vs2022_install: ${{ steps.node-gyp-patch.outputs.vs_path }}
        run: |
          success=0
          for i in 1 2 3; do
            echo "Attempt $i..."
            # --foreground-scripts serializes native (node-gyp) builds, avoiding
            # the parallel race on the shared node-addon-api/node_addon_api.sln
            # that throws FileExistsError (WinError 183) on Windows.
            if npm ci --prefer-offline --no-audit --progress=false --foreground-scripts; then
              success=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            # A failed install leaves Windows handles open on native module dirs
            # (@vscode/sqlite3, @parcel/watcher, node-pty, ...), so the next attempt
            # otherwise dies with EBUSY rmdir during npm's own cleanup. Clear it.
            rm -rf node_modules 2>/dev/null || true
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            echo "VS Code dependency install failed after 3 attempts" >&2
            exit 1
          fi

      - name: Install extension dependencies
        shell: bash
        working-directory: r/vscode/extensions/ritemark
        env:
          # Forward defense: keep node-gyp on Python 3.11 if a future extension
          # dependency adds a native module (none today). The patched node-gyp
          # 12.4.0 from the earlier step is already in place for the whole job.
          NODE_GYP_FORCE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false

      - name: Remove non-Windows binaries from claude-agent-sdk
        shell: bash
        working-directory: r/vscode/extensions/ritemark
        run: |
          SDK_VENDOR="node_modules/@anthropic-ai/claude-agent-sdk/vendor"
          if [ -d "$SDK_VENDOR/ripgrep" ]; then
            echo "Removing non-Windows ripgrep binaries..."
            rm -rf "$SDK_VENDOR/ripgrep/arm64-darwin"
            rm -rf "$SDK_VENDOR/ripgrep/arm64-linux"
            rm -rf "$SDK_VENDOR/ripgrep/x64-darwin"
            rm -rf "$SDK_VENDOR/ripgrep/x64-linux"
            echo "Kept only: $(ls $SDK_VENDOR/ripgrep/ 2>/dev/null || echo 'none')"
          fi

      - name: Remove conflicting files before patching
        shell: bash
        working-directory: r/vscode
        run: |
          rm -f src/vs/workbench/contrib/welcomeGettingStarted/browser/media/gettingStartedGuide.css 2>/dev/null || true

      - name: Strip non-Windows binaries from built-in copilot extension
        # VS Code 1.117 ships GitHub Copilot Chat (extensions/copilot). Its
        # nested claude-agent-sdk vendors macOS/Linux native binaries that
        # rcedit.exe cannot ingest during the win32-x64 packaging step
        # (audio-capture.node was the specific blocker on the prior run).
        # We can't drop the whole copilot extension because gulp's
        # prepareBuiltInCopilotExtensionShims hard-requires it. So we keep
        # the extension dir but drop every non-Windows binary tree under
        # the nested SDK's vendor/ folder.
        shell: bash
        working-directory: r/vscode
        run: |
          SDK_VENDOR="extensions/copilot/node_modules/@anthropic-ai/claude-agent-sdk/vendor"
          if [ -d "$SDK_VENDOR" ]; then
            for sub in audio-capture ripgrep; do
              if [ -d "$SDK_VENDOR/$sub" ]; then
                rm -rf "$SDK_VENDOR/$sub/arm64-darwin"
                rm -rf "$SDK_VENDOR/$sub/x64-darwin"
                rm -rf "$SDK_VENDOR/$sub/arm64-linux"
                rm -rf "$SDK_VENDOR/$sub/x64-linux"
                echo "Cleaned $sub: kept only $(ls $SDK_VENDOR/$sub/ 2>/dev/null || echo 'none')"
              fi
            done
          else
            echo "Copilot SDK vendor dir not present, skipping."
          fi

      - name: Compile extension
        shell: bash
        working-directory: r/vscode/extensions/ritemark
        run: npm run compile

      - name: Preserve dependency-backed workbench font
        shell: bash
        working-directory: r
        run: |
          # @phosphor-icons/web is a dev dependency and the extension is pruned
          # before the delayed shell patch step. Preserve the exact locked font
          # in its final VS Code location while the dependency still exists.
          PHOSPHOR_SOURCE="vscode/extensions/ritemark/node_modules/@phosphor-icons/web/src/regular/Phosphor.woff2"
          PHOSPHOR_DESTINATION="vscode/src/vs/base/browser/ui/codicons/codicon/phosphor.woff2"
          if [ ! -s "$PHOSPHOR_SOURCE" ]; then
            echo "ERROR: Required Phosphor workbench font is missing: $PHOSPHOR_SOURCE" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$PHOSPHOR_DESTINATION")"
          cp "$PHOSPHOR_SOURCE" "$PHOSPHOR_DESTINATION"
          test -s "$PHOSPHOR_DESTINATION"

      - name: Prune extension dev files before build
        shell: bash
        working-directory: r/vscode/extensions/ritemark
        run: |
          echo "Pruning dev-only dependencies and source files to reduce Windows packaging footprint"

          npm prune --omit=dev --legacy-peer-deps

          rm -rf src 2>/dev/null || true
          rm -rf scripts 2>/dev/null || true
          rm -rf webview 2>/dev/null || true

          rm -f .env_local 2>/dev/null || true
          rm -f .gitignore 2>/dev/null || true
          rm -f package-lock.json 2>/dev/null || true
          rm -f tsconfig.json 2>/dev/null || true

          echo "Retained top-level extension paths:"
          find . -maxdepth 1 -mindepth 1 | sort

      - name: Stage extension outside VS Code shell build
        shell: bash
        working-directory: r
        run: |
          # The shell build does not need to package Ritemark here: the final,
          # target-specific extension is copied into the app in the next step.
          # Keeping it under vscode/extensions makes VS Code eagerly open every
          # production dependency and can deadlock at Windows' descriptor cap.
          bash ./scripts/stage-extension-for-shell-build.sh \
            vscode/extensions/ritemark \
            "$RUNNER_TEMP/ritemark-extension"
          node ./scripts/tree-sha256.mjs \
            "$RUNNER_TEMP/ritemark-extension" \
            > "$RUNNER_TEMP/ritemark-extension.sha256"
          grep -Eq '^[a-f0-9]{64}$' "$RUNNER_TEMP/ritemark-extension.sha256"

      - name: Apply patches to staged shell state
        shell: bash
        working-directory: r
        run: |
          # Record provenance only after the extension has left the shell tree.
          # This keeps the complete VS Code fingerprint fail-closed on macOS
          # while binding Windows to its intentional absent-extension layout.
          ./scripts/apply-patches.sh --extension-layout absent
          ./scripts/verify-release-source.sh \
            --target win32-x64 --phase patched --extension-layout absent

      - name: Build VS Code (win32-x64-min)
        shell: bash
        working-directory: r/vscode
        run: |
          # Keep graceful-fs as baseline protection for VS Code's own built-in
          # extensions. Ritemark itself is staged outside this eager packager
          # and copied into the completed shell afterwards.
          #
          # The --require path MUST be absolute: NODE_OPTIONS is inherited by child
          # processes, and VS Code's build spawns `npm ls` from a DIFFERENT cwd
          # (build/lib/dependencies.ts execSync, cwd=<root>/extensions) to enumerate
          # production deps. A relative path fails to resolve there, crashing the
          # child, corrupting the dep list, and surfacing as "Invalid glob argument"
          # in doPackageLocalExtensionsStream. pwd -W gives a Windows-style absolute
          # path (C:/...) that Node accepts and that resolves from any cwd.
          PRELOAD="$(cd ../scripts && pwd -W)/graceful-fs-preload.cjs"
          export NODE_OPTIONS="--max-old-space-size=8192 --require ${PRELOAD}"
          echo "NODE_OPTIONS=$NODE_OPTIONS"
          echo "Starting Windows build at $(date)"
          npx gulp vscode-win32-x64-min
          echo "Build completed at $(date)"

      - name: Copy extension to build output
        shell: bash
        working-directory: r
        run: |
          BUILD_DIR="VSCode-win32-x64"
          EXT_DEST="$BUILD_DIR/resources/app/extensions/ritemark"
          WELCOME_DEST="$BUILD_DIR/resources/app/out/vs/workbench/contrib/welcomeGettingStarted/browser/media"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "ERROR: Build output not found at $BUILD_DIR"
            exit 1
          fi

          rm -rf "$EXT_DEST" || true
          STAGED_EXTENSION="$RUNNER_TEMP/ritemark-extension"
          if [ ! -s "$STAGED_EXTENSION/out/extension.js" ] || [ ! -s "$STAGED_EXTENSION/media/webview.js" ]; then
            echo "ERROR: Staged Ritemark extension is missing or incomplete: $STAGED_EXTENSION"
            exit 1
          fi

          cp -R "$STAGED_EXTENSION" "$EXT_DEST"
          rm -rf "$EXT_DEST/webview/node_modules" 2>/dev/null || true
          rm -rf "$EXT_DEST/webview/src" 2>/dev/null || true
          # Strip foreign-platform agent runtimes (Sprint 64). Keeps only
          # win32-x64/ inside binaries/agents/, removes darwin-arm64/ and
          # darwin-x64/ if present. Allowlist-based and idempotent.
          ./scripts/strip-foreign-agent-runtimes.sh "$EXT_DEST" win32 x64
          ./scripts/copy-welcome-assets.sh "$WELCOME_DEST"
          echo "Extension copied successfully"

      - name: Floor bundled extension version
        # GH #142: the built-in must sort below any X.Y.Z-ext.N OTA patch so
        # VS Code's extension scanner prefers a user-installed update. Shared
        # logic with build-prod-windows.sh via floor-bundled-extension.sh.
        shell: bash
        working-directory: r
        run: |
          RITEMARK_VERSION=$(python -c "import json; print(json.load(open('branding/product.json')).get('ritemarkVersion', ''))")
          if [ -z "$RITEMARK_VERSION" ]; then
            echo "ERROR: ritemarkVersion not found in branding/product.json"
            exit 1
          fi
          ./scripts/floor-bundled-extension.sh \
            "VSCode-win32-x64/resources/app/extensions/ritemark" \
            "$RITEMARK_VERSION"

      - name: Strip bundled copilot extension from output
        # VS Code 1.117 bundles GitHub Copilot Chat as a built-in extension.
        # gulp requires it during build, but the final Ritemark app doesn't
        # need it. It adds ~254MB and registers a "Chat Debug" activity bar
        # icon that conflicts with Ritemark's clean UI.
        shell: bash
        working-directory: r
        run: |
          COPILOT_EXT="VSCode-win32-x64/resources/app/extensions/copilot"
          if [ -d "$COPILOT_EXT" ]; then
            rm -rf "$COPILOT_EXT"
            echo "Removed bundled copilot extension"
          fi

      - name: Hide chat activity bar icon via CSS
        # Belt-and-suspenders: even with the copilot extension removed,
        # VS Code core registers a "Chat" view container in the activity bar.
        # Patch 003 disables it in source, but if the patch doesn't apply
        # cleanly the container leaks through. This CSS rule hides it.
        shell: bash
        working-directory: r
        run: |
          CSS_FILE="VSCode-win32-x64/resources/app/out/vs/workbench/workbench.desktop.main.css"
          if [ -f "$CSS_FILE" ]; then
            printf '\n/* Ritemark: hide VS Code chat view container from activity bar */\n.activitybar .action-item a[class*="workbench-panel-chat"] { display: none !important; }\n.activitybar .action-item:has(a[class*="workbench-panel-chat"]) { display: none !important; }\n.activitybar .action-item a[class*="copilot-chat"] { display: none !important; }\n.activitybar .action-item:has(a[class*="copilot-chat"]) { display: none !important; }\n' >> "$CSS_FILE"
            echo "Chat activity bar CSS hide rule appended"
          fi

      - name: Embed and verify build provenance
        shell: bash
        working-directory: r
        run: |
          STAGED_EXTENSION="$RUNNER_TEMP/ritemark-extension"
          STAGED_EXTENSION_SHA="$(cat "$RUNNER_TEMP/ritemark-extension.sha256")"
          node ./scripts/build-provenance.mjs \
            --write --target win32-x64 --app VSCode-win32-x64 \
            --extension-input "$STAGED_EXTENSION" \
            --expected-extension-sha "$STAGED_EXTENSION_SHA"
          node ./scripts/build-provenance.mjs \
            --verify --target win32-x64 --app VSCode-win32-x64 \
            --extension-input "$STAGED_EXTENSION" \
            --expected-extension-sha "$STAGED_EXTENSION_SHA"

      - name: Patch Ritemark.exe icon (branding)
        shell: bash
        working-directory: r
        run: |
          RCEDIT="vscode/node_modules/rcedit/bin/rcedit.exe"
          if [ ! -f "$RCEDIT" ] || [ ! -f "branding/icons/icon.ico" ]; then
            echo "ERROR: rcedit or branding icon is missing; refusing to sign an unbranded binary." >&2
            exit 1
          fi
          "$RCEDIT" "VSCode-win32-x64/Ritemark.exe" --set-icon "branding/icons/icon.ico"

      - name: Resolve Windows signing tools
        id: signing-tools
        shell: pwsh
        working-directory: r
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress | Out-Null
          }

          $clientRoot = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          New-Item -ItemType Directory -Path $clientRoot -Force | Out-Null
          nuget.exe install Microsoft.ArtifactSigning.Client -OutputDirectory $clientRoot -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Microsoft.ArtifactSigning.Client install failed ($LASTEXITCODE)." }

          $tools = ./scripts/find-windows-signing-tools.ps1 `
            -SdkBinRoot "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -ArtifactSigningClientRoot $clientRoot | ConvertFrom-Json

          $metadataPath = Join-Path $env:RUNNER_TEMP 'ritemark-artifact-signing-metadata.json'
          [ordered]@{
            Endpoint = 'https://neu.codesigning.azure.net'
            CodeSigningAccountName = 'ritemark-signing'
            CertificateProfileName = 'ritemark-public-trust'
          } | ConvertTo-Json | Set-Content -LiteralPath $metadataPath -Encoding utf8NoBOM

          "signtool=$($tools.signToolPath)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "dlib=$($tools.dlibPath)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "metadata=$metadataPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Find unsigned Windows binaries
        shell: pwsh
        working-directory: r
        run: |
          ./scripts/verify-windows-signatures.ps1 `
            -Mode PrepareSigning `
            -Root VSCode-win32-x64 `
            -CatalogPath windows-pe-signing-catalog.txt `
            -ExpectedPublisher $env:WINDOWS_PUBLISHER `
            -OwnedPathPattern 'Ritemark.exe'

      - name: Sign Windows binaries (Azure Artifact Signing)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net
          signing-account-name: ritemark-signing
          certificate-profile-name: ritemark-public-trust
          files-catalog: r/windows-pe-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed payload
        shell: pwsh
        working-directory: r
        run: |
          ./scripts/verify-windows-signatures.ps1 `
            -Mode Verify `
            -Root VSCode-win32-x64 `
            -SignToolPath '${{ steps.signing-tools.outputs.signtool }}' `
            -ExpectedPublisher $env:WINDOWS_PUBLISHER `
            -OwnedPathPattern 'Ritemark.exe'

      - name: Validate build
        shell: bash
        working-directory: r
        run: |
          BUILD_DIR="VSCode-win32-x64"
          EXT_PATH="$BUILD_DIR/resources/app/extensions/ritemark"
          ERRORS=0

          if ! node ./scripts/build-provenance.mjs \
              --verify --target win32-x64 --app "$BUILD_DIR"; then
            ERRORS=$((ERRORS + 1))
          fi

          if [ -f "$EXT_PATH/media/webview.js" ]; then
            WEBVIEW_SIZE=$(wc -c < "$EXT_PATH/media/webview.js" | tr -d ' ')
            if [ "$WEBVIEW_SIZE" -lt 500000 ]; then
              echo "FAIL: webview.js too small ($WEBVIEW_SIZE bytes)"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: webview.js ($WEBVIEW_SIZE bytes)"
            fi
          else
            echo "FAIL: webview.js not found"
            ERRORS=$((ERRORS + 1))
          fi

          if [ -f "$EXT_PATH/out/extension.js" ]; then
            EXTENSION_SIZE=$(wc -c < "$EXT_PATH/out/extension.js" | tr -d ' ')
            if [ "$EXTENSION_SIZE" -lt 1000 ]; then
              echo "FAIL: extension.js too small ($EXTENSION_SIZE bytes)"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: extension.js ($EXTENSION_SIZE bytes)"
            fi
          else
            echo "FAIL: extension.js not found"
            ERRORS=$((ERRORS + 1))
          fi

          if [ -f "$BUILD_DIR/resources/app/out/vs/workbench/contrib/welcomeGettingStarted/browser/media/ritemark-welcome-logo-full.svg" ] && \
             [ -f "$BUILD_DIR/resources/app/out/vs/workbench/contrib/welcomeGettingStarted/browser/media/ritemark-welcome-hero-bg.png" ]; then
            echo "OK: Welcome assets present"
          else
            echo "FAIL: Welcome assets missing"
            ERRORS=$((ERRORS + 1))
          fi

          if ! ./scripts/validate-build-output.sh win32-x64; then
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "Validation FAILED with $ERRORS error(s)"
            exit 1
          fi
          echo "Validation PASSED"

      - name: Build signed Windows installer (Inno Setup)
        id: installer
        shell: pwsh
        working-directory: r
        env:
          SIGNTOOL_PATH: ${{ steps.signing-tools.outputs.signtool }}
          ARTIFACT_SIGNING_DLIB: ${{ steps.signing-tools.outputs.dlib }}
          ARTIFACT_SIGNING_METADATA: ${{ steps.signing-tools.outputs.metadata }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress | Out-Null
          $version = '${{ steps.release.outputs.version }}'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src = (Resolve-Path 'VSCode-win32-x64').Path
          $wrapper = (Resolve-Path 'scripts/sign-windows-file.ps1').Path
          $signCommand = "pwsh.exe -NoLogo -NoProfile -File `$q$wrapper`$q -FilePath `$f -SignToolPath `$q$($env:SIGNTOOL_PATH)`$q -DlibPath `$q$($env:ARTIFACT_SIGNING_DLIB)`$q -MetadataPath `$q$($env:ARTIFACT_SIGNING_METADATA)`$q -ExpectedPublisher `$q$($env:WINDOWS_PUBLISHER)`$q"

          if (Test-Path -LiteralPath installer-output) {
            Remove-Item -LiteralPath installer-output -Recurse -Force
          }
          & $iscc "/DAppVersion=$version" "/DSourcePath=$src" '/DSign' "/Sazuresign=$signCommand" 'installer\windows\ritemark.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

          $versionedInstaller = "installer-output\Ritemark-$version-win32-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $versionedInstaller)) { throw "Installer missing: $versionedInstaller" }
          $canonicalInstaller = 'installer-output\Ritemark-Setup.exe'
          Move-Item -LiteralPath $versionedInstaller -Destination $canonicalInstaller
          "installer_path=$($canonicalInstaller.Replace('\', '/'))" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Verify install and uninstall as a standard user
        shell: pwsh
        working-directory: r
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.installer_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path -LiteralPath $env:INSTALLER_PATH).Path

          ./scripts/verify-windows-signatures.ps1 `
            -Mode Verify `
            -Root installer-output `
            -SignToolPath '${{ steps.signing-tools.outputs.signtool }}' `
            -ExpectedPublisher $env:WINDOWS_PUBLISHER `
            -OwnedPathPattern '*'

          $runId = [string]$env:GITHUB_RUN_ID
          $runIdSuffix = if ($runId.Length -gt 15) { $runId.Substring($runId.Length - 15) } else { $runId }
          $userName = "rmci-$runIdSuffix"
          if ($userName.Length -gt 20) { throw "Generated Windows test username exceeds 20 characters: $userName" }
          $plainPassword = "Ritemark!$([guid]::NewGuid().ToString('N'))"
          $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $credential = [pscredential]::new("$env:COMPUTERNAME\$userName", $securePassword)
          New-LocalUser -Name $userName -Password $securePassword -AccountNeverExpires | Out-Null
          try {
            $initializeProfile = Start-Process -FilePath 'cmd.exe' -Credential $credential -LoadUserProfile `
              -ArgumentList '/c','exit 0' -Wait -PassThru
            if ($initializeProfile.ExitCode -ne 0) { throw 'Could not initialize the standard-user profile.' }
            $profileRoot = "C:\Users\$userName"
            $installRoot = Join-Path $profileRoot 'AppData\Local\Programs\Ritemark'

            $hiveName = 'RitemarkCiUser'
            & reg.exe load "HKU\$hiveName" (Join-Path $profileRoot 'NTUSER.DAT') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not load standard-user registry hive before install.' }
            $uninstallKey = "Registry::HKEY_USERS\$hiveName\Software\Microsoft\Windows\CurrentVersion\Uninstall"
            $beforeKeys = @(Get-ChildItem $uninstallKey -ErrorAction SilentlyContinue | Select-Object -ExpandProperty PSChildName)
            & reg.exe unload "HKU\$hiveName" | Out-Null

            $install = Start-Process -FilePath $installer -Credential $credential -LoadUserProfile -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER',
              "/DIR=`"$installRoot`""
            ) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Standard-user silent install failed ($($install.ExitCode))." }

            ./scripts/verify-windows-signatures.ps1 `
              -Mode Verify `
              -Root $installRoot `
              -SignToolPath '${{ steps.signing-tools.outputs.signtool }}' `
              -ExpectedPublisher $env:WINDOWS_PUBLISHER `
              -OwnedPathPattern 'Ritemark.exe','unins*.exe'

            $startMenu = Join-Path $profileRoot 'AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Ritemark'
            $appLinks = @(Get-ChildItem -LiteralPath $startMenu -Filter 'Ritemark.lnk' -File -ErrorAction Stop)
            if ($appLinks.Count -ne 1) { throw "Expected one Ritemark Start menu entry, found $($appLinks.Count)." }

            & reg.exe load "HKU\$hiveName" (Join-Path $profileRoot 'NTUSER.DAT') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not load standard-user registry hive.' }
            try {
              $afterEntries = @(Get-ChildItem $uninstallKey -ErrorAction SilentlyContinue)
              $newEntries = @($afterEntries | Where-Object { $beforeKeys -notcontains $_.PSChildName })
              if ($newEntries.Count -ne 1) {
                throw "Installer created $($newEntries.Count) app registrations; expected exactly one and no bundleware."
              }
              $registration = Get-ItemProperty $newEntries[0].PSPath
              $registrationKeyName = $newEntries[0].PSChildName
              if ($registration.DisplayName -ne 'Ritemark') { throw 'The new app registration is not Ritemark.' }
              if ($registration.Publisher -ne $env:WINDOWS_PUBLISHER -or
                  $registration.DisplayVersion -ne '${{ steps.release.outputs.version }}') {
                throw 'Installed ProductName, Publisher, or Version is incorrect.'
              }
            } finally {
              [gc]::Collect()
              & reg.exe unload "HKU\$hiveName" | Out-Null
            }

            $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'unins*.exe' -File | Select-Object -First 1
            if ($null -eq $uninstaller) { throw 'Signed uninstaller was not installed.' }
            $uninstall = Start-Process -FilePath $uninstaller.FullName -Credential $credential -LoadUserProfile -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            ) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Standard-user silent uninstall failed ($($uninstall.ExitCode))." }
            if (Test-Path -LiteralPath $installRoot) { throw 'Uninstall left the Ritemark install directory behind.' }
            if (Test-Path -LiteralPath $startMenu) { throw 'Uninstall left the Ritemark Start menu group behind.' }

            & reg.exe load "HKU\$hiveName" (Join-Path $profileRoot 'NTUSER.DAT') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not load standard-user registry hive after uninstall.' }
            try {
              if (Test-Path -LiteralPath "$uninstallKey\$registrationKeyName") {
                throw 'Uninstall left the Ritemark app registration behind.'
              }
              $remainingRitemark = @(Get-ChildItem $uninstallKey -ErrorAction SilentlyContinue |
                Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'Ritemark' })
              if ($remainingRitemark.Count -ne 0) { throw 'Uninstall left a Ritemark app registration behind.' }
            } finally {
              [gc]::Collect()
              & reg.exe unload "HKU\$hiveName" | Out-Null
            }
          } finally {
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }

          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "installer=$([System.IO.Path]::GetFileName($installer))"
            "sha256=$sha256"
            "store_url=https://downloads.ritemark.app/windows/v${{ steps.release.outputs.version }}/Ritemark-Setup.exe"
            'Partner Center must receive this same file and SHA-256.'
          ) | Set-Content -LiteralPath installer-output/Ritemark-Setup.sha256.txt -Encoding utf8NoBOM

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ritemark-windows-installer
          path: |
            r/${{ steps.installer.outputs.installer_path }}
            r/installer-output/Ritemark-Setup.sha256.txt
          retention-days: 30

      - name: Build summary
        shell: bash
        working-directory: r
        run: |
          echo "Windows build, Productory signing, standard-user install/uninstall, and SHA-256 checks passed."
          ls -lh "${{ steps.installer.outputs.installer_path }}" installer-output/Ritemark-Setup.sha256.txt
