name: Daily test chain

# The extension's full `npm test` chain runs here once a day on main, and on demand
# (for example before an RC), instead of on every PR. A PR's proof is tsc, the tests it
# touches and the pre-commit hook; a failure here is fixed forward from that day's merges.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily-test-chain.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-test-chain
  cancel-in-progress: true

jobs:
  test-chain:
    name: npm test (extension)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Ritemark
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.22.1
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.1'

      - name: Install extension dependencies
        working-directory: extensions/ritemark
        run: npm ci --legacy-peer-deps

      - name: Install webview dependencies
        working-directory: extensions/ritemark/webview
        run: npm ci --legacy-peer-deps

      - name: Type-check the extension
        working-directory: extensions/ritemark
        run: npx tsc --noEmit -p ./

      - name: Run the full test chain
        working-directory: extensions/ritemark
        run: npm test > "$RUNNER_TEMP/npm-test.log" 2>&1

      - name: Show the failing lines
        if: failure()
        run: |
          { grep -nE "not ok|Error|FAIL|✖" "$RUNNER_TEMP/npm-test.log" | head -60; echo '--- last lines ---'; tail -30 "$RUNNER_TEMP/npm-test.log"; } > "$RUNNER_TEMP/failing.txt" || true
          cat "$RUNNER_TEMP/failing.txt"

      # Red main is never silent: one open issue labelled test-chain-red carries the failing
      # lines and the merges of the last day. The Development manager fixes it forward first,
      # and no RC is cut while it is open. A green run closes it.
      - name: Open or update the red-chain issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create test-chain-red --color B60205 --description "Daily test chain failed on main" 2>/dev/null || true
          {
            echo "The daily test chain failed on \`main\` at \`${GITHUB_SHA::8}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
            echo; echo "**Merges in the last 25 hours:**"; echo
            git log --since="25 hours ago" --format='- %h %s' origin/main
            echo; echo "**Failing lines:**"; echo; echo '```'; head -c 60000 "$RUNNER_TEMP/failing.txt"; echo '```'
          } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --label test-chain-red --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "Daily test chain is red on main" --label test-chain-red --body-file "$RUNNER_TEMP/body.md"; fi

      - name: Close the red-chain issue
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label test-chain-red --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Green again at \`${GITHUB_SHA::8}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-log
          path: ${{ runner.temp }}/npm-test.log
          retention-days: 14
