<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ritemark slide template — Comparison</title>
<link rel="stylesheet" href="slide-base.css">
</head>
<body>

<nav class="slide-nav">
  <a href="index.html">← Index</a>
  <a href="cover.html">Cover</a>
  <a href="section.html">Section</a>
  <a href="content.html">Content</a>
  <a href="quote.html">Quote</a>
  <a href="comparison.html" class="is-current">Compare</a>
  <a href="data.html">Data</a>
  <a href="end.html">End</a>
</nav>

<div class="slide">
  <div class="content">
    <div class="eyebrow">Contrast</div>
    <h2 style="font-size: 56px; margin-bottom: 64px;">Before and after.</h2>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 48px; flex: 1;">
      <div>
        <div style="font-size: 18px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--r-ink-muted); margin-bottom: 24px;">Before</div>
        <div style="font-family: var(--ritemark-font-display); font-size: 40px; font-weight: 600; line-height: 1.15; color: var(--r-ink-strong); margin-bottom: 24px;">
          Active row is just a colored background.
        </div>
        <div style="padding: 32px; background: var(--r-surface-soft); border: 1px solid var(--r-hairline); border-radius: var(--ritemark-radius-lg);">
          <div style="padding: 8px 12px; border-radius: var(--ritemark-radius-sm); color: var(--r-ink-body); font-size: 20px;">notes.md</div>
          <div style="padding: 8px 12px; border-radius: var(--ritemark-radius-sm); color: var(--r-ink-body); background: var(--r-accent-soft); font-size: 20px;">goals-q1.md</div>
          <div style="padding: 8px 12px; border-radius: var(--ritemark-radius-sm); color: var(--r-ink-body); font-size: 20px;">inbox.md</div>
        </div>
      </div>
      <div>
        <div style="font-size: 18px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--r-accent); margin-bottom: 24px;">After</div>
        <div style="font-family: var(--ritemark-font-display); font-size: 40px; font-weight: 600; line-height: 1.15; color: var(--r-ink-strong); margin-bottom: 24px;">
          Border + background + weight.
        </div>
        <div style="padding: 32px; background: var(--r-surface-soft); border: 1px solid var(--r-hairline); border-radius: var(--ritemark-radius-lg);">
          <div style="padding: 8px 12px; border-radius: var(--ritemark-radius-sm); color: var(--r-ink-body); font-size: 20px;">notes.md</div>
          <div style="padding: 8px 10px; border-radius: var(--ritemark-radius-sm); color: var(--r-ink-strong); background: var(--r-accent-soft); border-left: 2px solid var(--r-accent); font-size: 20px; font-weight: 500;">goals-q1.md</div>
          <div style="padding: 8px 12px; border-radius: var(--ritemark-radius-sm); color: var(--r-ink-body); font-size: 20px;">inbox.md</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
