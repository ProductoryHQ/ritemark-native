<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — Whole Page (Unified Keys) · Sprint 76 Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700&display=swap');
  :root {
    --r-surface: #FFFFFF;
    --r-surface-muted: #F8FAFC;
    --r-surface-soft: #F1F5F9;
    --r-hairline: #E2E8F0;
    --r-hairline-strong: #CBD5E1;
    --r-ink-strong: #1E1B4B;
    --r-ink-body: #475569;
    --r-ink-muted: #64748B;
    --r-ink-faint: #94A3B8;
    --r-accent: #4338CA;
    --r-accent-deep: #3730A3;
    --r-accent-soft: #E0E7FF;
    --r-success: #16A34A;
    --r-success-soft: #F0FDF4;
    --r-shadow-sm: 0 1px 2px rgba(30,27,75,0.06);
    --r-font-ui: 'Sofia Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { font-family: var(--r-font-ui); background: var(--r-surface-muted); color: var(--r-ink-strong); -webkit-font-smoothing: antialiased; }

  .switch-btn {
    padding: 5px 12px; font-size: 12px; font-weight: 500; border-radius: 4px;
    border: 1px solid var(--r-hairline); background: var(--r-surface); color: var(--r-ink-body);
    cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .switch-btn:hover { background: var(--r-surface-soft); color: var(--r-ink-strong); }
  .switch-btn.active { background: var(--r-accent-soft); border-color: var(--r-accent); color: var(--r-accent-deep); }
  a.home-link:hover { text-decoration: underline; }
  .anno {
    background: #FEF9C3; border: 1px solid #FDE68A; color: #713F12;
    border-radius: 8px; padding: 8px 11px; font-size: 11.5px; line-height: 1.45;
  }
  /* highlight ring marking what changed vs today's production page */
  .changed { outline: 2px dashed #F59E0B; outline-offset: 4px; border-radius: 12px; position: relative; }
  .changed-tag {
    position: absolute; top: -10px; right: 12px; background: #F59E0B; color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 2px 8px; border-radius: 99px;
  }

  /* ====== Settings page primitives (mirror RitemarkSettings.tsx) ====== */
  .page { max-width: 760px; margin: 0 auto; padding: 32px 28px 80px; }
  .section { margin-bottom: 32px; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .section-head h2 { font-size: 18px; font-weight: 600; color: var(--r-ink-strong); }
  .card {
    padding: 20px; border-radius: 10px; background: var(--r-surface);
    border: 1px solid var(--r-hairline); box-shadow: var(--r-shadow-sm); margin-bottom: 20px;
  }
  .card:last-child { margin-bottom: 0; }
  .card-label { font-size: 14px; font-weight: 600; color: var(--r-ink-strong); }
  .opt { font-size: 13px; font-weight: 400; color: var(--r-ink-muted); margin-left: 8px; }
  .badge-ok { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--r-success); font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--r-success); display: inline-block; }

  .key-row { display: flex; gap: 10px; margin-top: 14px; }
  .key-input {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    background: var(--r-surface-soft); border: 1px solid var(--r-hairline);
    border-radius: 10px; padding: 13px 14px; font-size: 14px; color: var(--r-ink-faint);
  }
  .key-input.filled { color: var(--r-ink-strong); letter-spacing: 2px; }
  .btn-save {
    background: var(--r-accent); color: #fff; font-weight: 600; font-size: 15px;
    padding: 0 26px; border-radius: 12px; border: 0; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(67,56,202,0.25);
  }
  .btn-save:hover { background: var(--r-accent-deep); }
  .btn-test {
    background: var(--r-surface-soft); color: var(--r-ink-muted); font-weight: 600; font-size: 15px;
    padding: 0 26px; border-radius: 12px; border: 0; cursor: pointer;
  }
  .used-for { margin-top: 14px; font-size: 14px; color: var(--r-ink-body); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .used-for .new-mention { background: var(--r-accent-soft); color: var(--r-accent-deep); padding: 0 6px; border-radius: 5px; font-weight: 600; }
  .get-key { color: var(--r-accent); font-weight: 600; text-decoration: underline; cursor: pointer; white-space: nowrap; }

  /* account cards (Claude / ChatGPT OAuth) */
  .acct-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .acct-btn {
    background: var(--r-surface); color: var(--r-ink-strong); font-weight: 600; font-size: 14px;
    padding: 9px 18px; border-radius: 10px; border: 1px solid var(--r-hairline-strong); cursor: pointer;
  }

  /* simple placeholder blocks for non-key sections */
  .ph { background: var(--r-surface-soft); border: 1px dashed var(--r-hairline-strong); border-radius: 8px; padding: 14px; font-size: 13px; color: var(--r-ink-faint); text-align: center; }

  .success-banner {
    margin-top: 12px; display: flex; align-items: center; gap: 8px; background: var(--r-success-soft);
    color: var(--r-success); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; font-weight: 500;
  }
</style>
</head>
<body class="min-h-screen">

  <!-- Fixed state switcher bar -->
  <div class="sticky top-0 z-20 border-b" style="background:var(--r-surface);border-color:var(--r-hairline)">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center gap-4 flex-wrap">
      <a href="index.html" class="home-link text-xs font-medium" style="color:var(--r-accent-deep)">&larr; All states</a>
      <span class="text-xs font-semibold" style="color:var(--r-ink-strong)">Settings · Whole Page — Unified Provider Keys (no separate BYOK section)</span>
      <div class="flex items-center gap-1.5 ml-auto" id="switcher"></div>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-6 pt-6 relative">
    <div id="anno" class="mb-4"></div>
  </div>

  <div id="stage"></div>

<script>
// ---------- icons ----------
function icon(name, size=20, color='var(--r-ink-strong)') {
  const paths = {
    palette: 'M200.77,53.89A103.27,103.27,0,0,0,128,24h-1.07A104,104,0,0,0,24,128c0,43,26.58,79.06,69.36,94.17A32,32,0,0,0,136,192a16,16,0,0,1,16-16h46.21a31.81,31.81,0,0,0,31.2-24.88,104.43,104.43,0,0,0,2.59-24A103.28,103.28,0,0,0,200.77,53.89Z',
    gear: 'M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06Z',
    key: 'M216.57,39.43A80,80,0,0,0,83.91,120.78L28.69,176A15.86,15.86,0,0,0,24,187.31V216a16,16,0,0,0,16,16H72a8,8,0,0,0,8-8V208H96a8,8,0,0,0,8-8V184h16a8,8,0,0,0,5.66-2.34l9.56-9.57A80,80,0,0,0,216.57,39.43ZM180,92a16,16,0,1,1,16-16A16,16,0,0,1,180,92Z',
    timer: 'M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm45.66,61.66-40,40a8,8,0,0,1-11.32-11.32l40-40a8,8,0,0,1,11.32,11.32ZM96,16a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,16Z',
    textT: 'M208,56V88a8,8,0,0,1-16,0V64H136V192h24a8,8,0,0,1,0,16H96a8,8,0,0,1,0-16h24V64H64V88a8,8,0,0,1-16,0V56a8,8,0,0,1,8-8H200A8,8,0,0,1,208,56Z',
    update: 'M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z',
    eye: 'M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z',
    check: 'M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z',
    ext: 'M224,104a8,8,0,0,1-16,0V59.32l-66.33,66.34a8,8,0,0,1-11.32-11.32L196.68,48H152a8,8,0,0,1,0-16h64a8,8,0,0,1,8,8Zm-40,24a8,8,0,0,0-8,8v72H48V80h72a8,8,0,0,0,0-16H48A16,16,0,0,0,32,80V208a16,16,0,0,0,16,16H176a16,16,0,0,0,16-16V136A8,8,0,0,0,184,128Z',
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 256 256" fill="${color}"><path d="${paths[name]||paths.key}"/></svg>`;
}

// ---------- shared building blocks ----------
function sectionHead(iconName, title) {
  return `<div class="section-head">${icon(iconName)}<h2>${title}</h2></div>`;
}

function keyInput(placeholder, filled) {
  return `<div class="key-input ${filled ? 'filled' : ''}">
    <span>${filled ? '••••••••••••••••••••••••' : placeholder}</span>
    ${icon('eye', 20, 'var(--r-ink-muted)')}
  </div>`;
}

// usedFor: array of segments; object segments get the indigo "new mention" highlight
function usedForLine(segments, getKeyText) {
  const parts = segments.map(s =>
    typeof s === 'string' ? s : `<span class="new-mention">${s.text}</span>`
  ).join(', ');
  return `<div class="used-for">
    <span>Used for: ${parts}</span>
    <span class="get-key">${getKeyText}</span>
    ${icon('ext', 13, 'var(--r-accent)')}
  </div>`;
}

function apiKeyCard({ label, optional, configured, placeholder, usedFor, getKeyText, changed, changedLabel, banner }) {
  return `<div class="card ${changed ? 'changed' : ''}">
    ${changed ? `<div class="changed-tag">${changedLabel || 'CHANGED'}</div>` : ''}
    <div class="flex items-center justify-between">
      <div class="card-label">${label}${optional ? '<span class="opt">(optional)</span>' : ''}</div>
      ${configured ? `<span class="badge-ok"><span class="dot"></span>Configured</span>` : ''}
    </div>
    <div class="key-row">
      ${keyInput(placeholder, configured)}
      <button class="btn-save">Save</button>
      <button class="btn-test">Test</button>
    </div>
    ${banner || ''}
    ${usedForLine(usedFor, getKeyText)}
  </div>`;
}

function accountCard({ label, signedIn, usedFor }) {
  return `<div class="card">
    <div class="acct-row">
      <div>
        <div class="card-label">${label}</div>
        <div class="used-for" style="margin-top:8px">Used for: ${usedFor}</div>
      </div>
      <div class="flex items-center gap-3">
        ${signedIn ? `<span class="badge-ok"><span class="dot"></span>Signed in</span>` : ''}
        <button class="acct-btn">${signedIn ? 'Sign out' : 'Sign in'}</button>
      </div>
    </div>
  </div>`;
}

// ---------- non-key sections (context only) ----------
function appearanceSection() {
  return `<div class="section">${sectionHead('palette','Appearance')}
    <div class="card"><div class="ph">Theme preview cards (unchanged — context only)</div></div>
  </div>`;
}
function agentRuntimeSection() {
  return `<div class="section">${sectionHead('gear','Agent Runtime')}
    <div class="card"><div class="ph">Runtime preference: Bundled / System (unchanged — context only)</div></div>
  </div>`;
}
function timeoutSection() {
  return `<div class="section">${sectionHead('timer','Agent Timeout')}
    <div class="card"><div class="ph">Timeout setting (unchanged — context only)</div></div>
  </div>`;
}
function chatAppearanceSection() {
  return `<div class="section">${sectionHead('textT','Chat Appearance')}
    <div class="card"><div class="ph">Chat font &amp; density settings (unchanged — context only)</div></div>
  </div>`;
}
function updatesSection() {
  return `<div class="section">${sectionHead('update','Updates')}
    <div class="card"><div class="ph">Update center (unchanged — context only)</div></div>
  </div>`;
}

// ---------- the API Keys section (where ALL Sprint 76 changes live) ----------
function apiKeysSection({ flagOn = true, googleConfigured = false, openrouterConfigured = false, googleBanner = false }) {
  const cards = [];

  // Account cards — UNCHANGED
  cards.push(accountCard({
    label: 'Claude Account', signedIn: true,
    usedFor: 'Claude agents (autonomous file work), Claude Flow nodes'
  }));
  cards.push(accountCard({
    label: 'ChatGPT Account', signedIn: false,
    usedFor: 'Codex Agents (autonomous coding)'
  }));

  // OpenAI — "Used for" gains OpenCode mention when flag on
  cards.push(apiKeyCard({
    label: 'OpenAI API Key',
    placeholder: 'sk-...',
    usedFor: flagOn
      ? ['AI Chat', 'Flows (LLM)', 'Image Generation (GPT Image 1.5)', { text: 'OpenCode (GPT models)' }]
      : ['AI Chat', 'Flows (LLM)', 'Image Generation (GPT Image 1.5)'],
    getKeyText: 'Get API key',
    changed: flagOn, changedLabel: 'COPY CHANGE ONLY'
  }));

  // Google AI — gains OpenCode mention
  cards.push(apiKeyCard({
    label: 'Google AI API Key', optional: true,
    configured: googleConfigured,
    placeholder: 'AIza...',
    banner: googleBanner ? `<div class="success-banner">${icon('check',16,'var(--r-success)')} Key saved — Gemini models are now available in OpenCode</div>` : '',
    usedFor: flagOn
      ? [{ text: 'Gemini models in OpenCode' }, 'Flows']
      : ['Gemini models', 'Flows'],
    getKeyText: 'Get API key',
    changed: flagOn, changedLabel: 'COPY CHANGE ONLY'
  }));

  // Anthropic — gains OpenCode mention
  cards.push(apiKeyCard({
    label: 'Anthropic API Key', optional: true,
    placeholder: 'sk-ant-...',
    usedFor: flagOn
      ? ['Claude in Ritemark (alternative to signing in with Claude.ai)', { text: 'OpenCode (Claude models)' }]
      : ['Claude in Ritemark (alternative to signing in with Claude.ai)'],
    getKeyText: 'Get API key',
    changed: flagOn, changedLabel: 'COPY CHANGE ONLY'
  }));

  // OpenRouter — THE ONLY NEW CARD, flag-gated
  if (flagOn) {
    cards.push(apiKeyCard({
      label: 'OpenRouter API Key', optional: true,
      configured: openrouterConfigured,
      placeholder: 'sk-or-...',
      usedFor: [{ text: 'OpenCode — hundreds of models from multiple providers through a single key' }],
      getKeyText: 'Get an OpenRouter key',
      changed: true, changedLabel: 'NEW CARD'
    }));
  }

  return `<div class="section">${sectionHead('key','API Keys')}${cards.join('')}</div>`;
}

// ---------- whole page ----------
function wholePage(opts) {
  return `<div class="page">
    <div style="margin-bottom:28px">
      <h1 style="font-size:24px;font-weight:700;color:var(--r-ink-strong)">Settings</h1>
      <p style="font-size:14px;color:var(--r-ink-muted);margin-top:4px">Configure Ritemark's appearance, AI providers, and behavior.</p>
    </div>
    ${appearanceSection()}
    ${agentRuntimeSection()}
    ${apiKeysSection(opts)}
    ${timeoutSection()}
    ${chatAppearanceSection()}
    ${updatesSection()}
  </div>`;
}

// ---------- states ----------
function buildState(id) {
  switch (id) {
    case 'S1':
      return {
        anno: '<strong>S1 — Whole page, default.</strong> All 7 sections shown. Sprint 76 changes are marked with dashed amber outlines: 3 existing key cards get OpenCode added to their "Used for:" line (copy change only — indigo highlight), and ONE new card appears (OpenRouter). Nothing else on the page changes. No separate BYOK section exists.',
        html: wholePage({ flagOn: true })
      };
    case 'S2':
      return {
        anno: '<strong>S2 — One key unlocks OpenCode.</strong> User saves a Google AI key (which may already exist for Flows). Green confirmation explains the consequence: Gemini models are now available in OpenCode. Same key, every feature — configured exactly once.',
        html: wholePage({ flagOn: true, googleConfigured: true, googleBanner: true })
      };
    case 'S3':
      return {
        anno: '<strong>S3 — API Keys section close-up.</strong> The full credential inventory: 2 account cards (Claude, ChatGPT — unchanged) + 4 provider key cards (OpenAI, Google AI, Anthropic + new OpenRouter). One card per provider on the entire page. OpenCode consumes the same stored keys.',
        html: `<div class="page">${apiKeysSection({ flagOn: true })}</div>`
      };
    case 'S4':
      return {
        anno: '<strong>S4 — OpenRouter configured.</strong> The only genuinely new card on the page, in its configured state (badge + masked key). Optional — users who don\'t know what OpenRouter is can ignore it.',
        html: `<div class="page">${apiKeysSection({ flagOn: true, openrouterConfigured: true })}</div>`
      };
    case 'S5':
      return {
        anno: '<strong>S5 — Feature flag OFF.</strong> No OpenRouter card, no OpenCode mentions in any "Used for:" line. One difference from today\'s production page: the stale "Imagen 3 (coming soon)" copy on the Google AI card is removed regardless of flag state (Jarmo, 2026-06-01 — no such feature).',
        html: wholePage({ flagOn: false })
      };
  }
}

const STATES = ['S1','S2','S3','S4','S5'];

function render(id) {
  if (!STATES.includes(id)) id = 'S1';
  const s = buildState(id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('anno').innerHTML = `<div class="anno">${s.anno}</div>`;
  document.querySelectorAll('.switch-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  if (location.hash !== '#'+id) history.replaceState(null,'','#'+id);
}

const sw = document.getElementById('switcher');
sw.innerHTML = STATES.map(s => `<button class="switch-btn" data-id="${s}">${s}</button>`).join('');
sw.addEventListener('click', e => { if (e.target.dataset.id) render(e.target.dataset.id); });

render((location.hash || '#S1').slice(1));
window.addEventListener('hashchange', () => render((location.hash||'#S1').slice(1)));
</script>
</body>
</html>
