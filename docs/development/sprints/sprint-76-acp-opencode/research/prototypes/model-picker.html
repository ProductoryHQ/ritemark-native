<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Selector — OpenCode Model Picker · Sprint 76 Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700&display=swap');
  :root {
    --r-surface: #FFFFFF;
    --r-surface-muted: #F8FAFC;
    --r-surface-soft: #F1F5F9;
    --r-hairline: #E2E8F0;
    --r-hairline-strong: #CBD5E1;
    --r-ink-strong: #1E1B4B;
    --r-ink-body: #475569;
    --r-ink-muted: #64748B;
    --r-ink-faint: #94A3B8;
    --r-accent: #4338CA;
    --r-accent-deep: #3730A3;
    --r-accent-soft: #E0E7FF;
    --r-ring-color: rgba(67, 56, 202, 0.10);
    --r-shadow-indigo-sm: 0 4px 6px -1px rgba(67, 56, 202, 0.25);
    --r-shadow-lg: 0 10px 15px -3px rgba(30,27,75,0.10), 0 4px 6px -4px rgba(30,27,75,0.08);
    --r-font-ui: 'Sofia Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { font-family: var(--r-font-ui); background: var(--r-surface-muted); color: var(--r-ink-strong); -webkit-font-smoothing: antialiased; }

  .switch-btn {
    padding: 5px 12px; font-size: 12px; font-weight: 500; border-radius: 4px;
    border: 1px solid var(--r-hairline); background: var(--r-surface); color: var(--r-ink-body);
    cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .switch-btn:hover { background: var(--r-surface-soft); color: var(--r-ink-strong); }
  .switch-btn.active { background: var(--r-accent-soft); border-color: var(--r-accent); color: var(--r-accent-deep); }
  a.home-link:hover { text-decoration: underline; }
  .anno {
    background: #FEF9C3; border: 1px solid #FDE68A; color: #713F12;
    border-radius: 8px; padding: 8px 11px; font-size: 11.5px; line-height: 1.45; max-width: 300px;
  }

  /* Sidebar shell — VS Code-like right panel */
  .sidebar {
    width: 340px; background: var(--r-surface-muted); border: 1px solid var(--r-hairline);
    border-radius: 8px; overflow: hidden; box-shadow: var(--r-shadow-lg);
    display: flex; flex-direction: column; min-height: 460px;
  }
  .sidebar-head {
    padding: 8px 12px; border-bottom: 1px solid var(--r-hairline);
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--r-ink-muted); background: var(--r-surface-muted);
  }

  /* Trigger (Select) */
  .trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    height: 28px; padding: 0 8px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--r-hairline-strong); background: var(--r-surface);
    color: var(--r-ink-strong); cursor: pointer; width: 100%;
  }
  .trigger.muted { color: var(--r-ink-muted); }

  /* Dropdown panel */
  .menu {
    margin-top: 4px; background: var(--r-surface); border: 1px solid var(--r-hairline);
    border-radius: 8px; box-shadow: var(--r-shadow-lg); padding: 4px; max-width: 300px;
  }
  .menu-label {
    padding: 8px 8px 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--r-ink-strong);
  }
  .menu-sep { height: 1px; background: var(--r-hairline); margin: 4px -4px; }
  .menu-item {
    display: flex; align-items: center; padding: 6px 8px 6px 28px; font-size: 12px;
    border-radius: 4px; color: var(--r-ink-strong); cursor: pointer; position: relative;
  }
  .menu-item:hover { background: var(--r-surface-soft); }
  .menu-item.selected { background: var(--r-accent-soft); color: var(--r-ink-strong); font-weight: 500; }
  .menu-item .check { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); }
  .sub { margin-left: 6px; font-size: 10px; opacity: 0.6; }
  .menu-info { padding: 8px; font-size: 12px; color: var(--r-ink-muted); }
  .menu-link { font-size: 12px; color: var(--r-accent-deep); cursor: pointer; font-weight: 500; }
  .menu-link:hover { text-decoration: underline; }

  /* Zero-key setup card (CodexSetupView pattern) */
  .setup-card {
    border-radius: 12px; border: 1px solid var(--r-hairline); background: var(--r-surface); padding: 16px;
  }
  .setup-btn {
    display: inline-flex; align-items: center; gap: 8px; border-radius: 6px;
    background: var(--r-accent); padding: 8px 12px; font-size: 12px; font-weight: 500; color: #fff;
    border: 0; cursor: pointer;
  }
  .setup-btn:hover { background: var(--r-accent-deep); }
</style>
</head>
<body class="min-h-screen">

  <!-- Fixed state switcher bar -->
  <div class="sticky top-0 z-20 border-b" style="background:var(--r-surface);border-color:var(--r-hairline)">
    <div class="max-w-4xl mx-auto px-6 py-3 flex items-center gap-4 flex-wrap">
      <a href="index.html" class="home-link text-xs font-medium" style="color:var(--r-accent-deep)">&larr; All states</a>
      <span class="text-xs font-semibold" style="color:var(--r-ink-strong)">AI Sidebar · Agent Selector</span>
      <div class="flex items-center gap-1.5 ml-auto" id="switcher"></div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-6 py-10 relative">
    <div id="anno"></div>
    <div class="flex justify-center">
      <div id="stage"></div>
    </div>
  </div>

<script>
// ---------- icons ----------
function checkIcon() {
  return `<svg class="check" width="14" height="14" viewBox="0 0 256 256" fill="var(--r-accent)"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>`;
}
function caret() {
  return `<svg width="14" height="14" viewBox="0 0 256 256" fill="var(--r-ink-muted)"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>`;
}
function arrowRight() {
  return `<svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor" style="display:inline-block;vertical-align:-1px"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>`;
}
function plugsIcon() {
  return `<svg width="20" height="20" viewBox="0 0 256 256" fill="var(--r-accent)"><path d="M105.07,192.32,90.34,207.05,73,189.66,53.66,209,42.34,197.66,61.66,178.34,44.27,161,59,146.27a8,8,0,0,1,11.31,0L105.07,181A8,8,0,0,1,105.07,192.32Zm106.59-95.31L197,82.34,178.34,101,155,77.66,173.66,59,159,44.27a8,8,0,0,0-11.31,0l-34.75,34.74a8,8,0,0,0,0,11.32l46.07,46.07a8,8,0,0,0,11.32,0l45.05-45.06A8,8,0,0,0,211.66,97Z"/></svg>`;
}

// ---------- model data (exact from spec) ----------
const OPENCODE_MODELS = [
  { label: 'Gemini 3 Pro',     sub: 'Google' },
  { label: 'Gemini 3 Flash',   sub: 'Google · faster' },
  { label: 'GPT-5.2',          sub: 'OpenAI' },
  { label: 'GPT-4o',           sub: 'OpenAI · faster' },
  { label: 'Claude Sonnet 4.6', sub: 'Anthropic' },
];
const GEMINI_ONLY = OPENCODE_MODELS.slice(0, 2);

// ---------- dropdown groups ----------
function claudeGroup() {
  return `
    <div class="menu-label">Claude</div>
    <div class="menu-item">Sonnet 4.6 <span class="sub">Best for everyday tasks</span></div>
    <div class="menu-item">Opus 4 <span class="sub">Most capable</span></div>
    <div class="menu-item">Haiku 3.5 <span class="sub">Fastest</span></div>`;
}
function codexGroup() {
  return `
    <div class="menu-label">Codex</div>
    <div class="menu-item">codex-1 <span class="sub">OpenAI agent</span></div>`;
}
function opencodeGroup(models, selectedLabel) {
  const rows = models.map(m =>
    `<div class="menu-item ${m.label===selectedLabel ? 'selected' : ''}">${m.label===selectedLabel ? checkIcon() : ''}${m.label} <span class="sub">${m.sub}</span></div>`
  ).join('');
  return `<div class="menu-label">OpenCode</div>${rows}`;
}
function opencodeZeroKeyGroup() {
  return `
    <div class="menu-label">OpenCode</div>
    <div class="menu-info flex items-center justify-between gap-3">
      <span>Add API keys to use OpenCode</span>
      <span class="menu-link inline-flex items-center gap-1">${arrowRight()} Open Settings</span>
    </div>`;
}

// ---------- sidebar shells ----------
function sidebarWithMenu({ triggerLabel, triggerMuted=false, menuHTML, showModeRail=false }) {
  return `
  <div class="sidebar">
    <div class="sidebar-head">AI Assistant</div>
    <div style="padding:8px 12px;border-bottom:1px solid var(--r-hairline)">
      <div class="trigger ${triggerMuted ? 'muted' : ''}">
        <span class="truncate">${triggerLabel}</span>
        ${caret()}
      </div>
      ${menuHTML ? `<div class="menu">${menuHTML}</div>` : ''}
      ${showModeRail ? modeRail() : ''}
    </div>
    <div style="flex:1"></div>
  </div>`;
}

function modeRail() {
  // Codex-only rail — shown ONLY for context comparison; never for OpenCode.
  return `<div class="flex gap-1.5 mt-1.5">
    <button style="padding:0 10px;height:24px;font-size:11px;font-weight:500;border-radius:4px;border:1px solid var(--r-accent);background:var(--r-accent-soft);color:var(--r-accent-deep)">Edit</button>
    <button style="padding:0 10px;height:24px;font-size:11px;font-weight:500;border-radius:4px;border:1px solid var(--r-hairline);background:var(--r-surface);color:var(--r-ink-body)">Plan</button>
  </div>`;
}

// full sidebar with zero-key setup card in the body
function sidebarZeroKey(triggerLabel) {
  return `
  <div class="sidebar">
    <div class="sidebar-head">AI Assistant</div>
    <div style="padding:8px 12px;border-bottom:1px solid var(--r-hairline)">
      <div class="trigger"><span class="truncate">${triggerLabel}</span>${caret()}</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:12px">
      <div class="setup-card">
        <div class="flex items-start gap-3">
          <div class="shrink-0" style="margin-top:2px">${plugsIcon()}</div>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-semibold" style="color:var(--r-ink-strong)">Set up your API keys</div>
            <p class="mt-1 text-xs leading-5" style="color:var(--r-ink-muted)">OpenCode uses your own provider accounts for AI. Add at least one key (Gemini, OpenAI, Anthropic, or OpenRouter) to get started.</p>
            <div class="mt-4">
              <button class="setup-btn">Open Key Settings</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ---------- states ----------
function buildState(id) {
  switch (id) {
    case 'A1':
      return {
        anno: 'Dropdown OPEN, keys configured. OpenCode group appended after Codex with 5 models + inline provider sub-text. Claude/Codex groups shown for context.',
        html: sidebarWithMenu({
          triggerLabel: 'OpenCode · Gemini 3 Pro',
          menuHTML: claudeGroup() + `<div class="menu-sep"></div>` + codexGroup() + `<div class="menu-sep"></div>` + opencodeGroup(OPENCODE_MODELS, 'Gemini 3 Pro')
        })
      };
    case 'A2':
      return {
        anno: 'Dropdown OPEN, no keys. OPENCODE group still appears (discoverability) showing one non-selectable row: "Add API keys to use OpenCode" + Open Settings link.',
        html: sidebarWithMenu({
          triggerLabel: 'Claude · Sonnet 4.6',
          menuHTML: claudeGroup() + `<div class="menu-sep"></div>` + codexGroup() + `<div class="menu-sep"></div>` + opencodeZeroKeyGroup()
        })
      };
    case 'A3':
      return {
        anno: 'Dropdown CLOSED, OpenCode · Gemini 3 Pro selected. No Edit/Plan mode rail (OpenCode has no modes this sprint).',
        html: sidebarWithMenu({ triggerLabel: 'OpenCode · Gemini 3 Pro', menuHTML: null, showModeRail: false })
      };
    case 'A4':
      return {
        anno: 'Full sidebar — OpenCode selected, no keys. Zero-key inline card (CodexSetupView pattern): plugs icon, heading, copy, "Open Key Settings" primary button.',
        html: sidebarZeroKey('OpenCode · Select a model…')
      };
    case 'A5':
      return {
        anno: 'Dropdown OPEN, only Gemini key configured. OpenCode group filtered to the 2 Gemini models. Group label still shows. No "add a key" CTA inside the picker.',
        html: sidebarWithMenu({
          triggerLabel: 'OpenCode · Gemini 3 Pro',
          menuHTML: claudeGroup() + `<div class="menu-sep"></div>` + codexGroup() + `<div class="menu-sep"></div>` + opencodeGroup(GEMINI_ONLY, 'Gemini 3 Pro')
        })
      };
    case 'A6':
      return {
        anno: 'Trigger stale state — selected model\'s provider key was removed. Trigger reads "OpenCode · Select a model…" in muted ink. User must re-pick before sending.',
        html: sidebarWithMenu({ triggerLabel: 'OpenCode · Select a model…', triggerMuted: true, menuHTML: null })
      };
  }
}

const STATES = ['A1','A2','A3','A4','A5','A6'];

function render(id) {
  if (!STATES.includes(id)) id = 'A1';
  const s = buildState(id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('anno').innerHTML =
    `<div class="absolute top-10 right-6 anno z-10"><strong>${id}</strong> — ${s.anno}</div>`;
  document.querySelectorAll('.switch-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  if (location.hash !== '#'+id) history.replaceState(null,'','#'+id);
}

const sw = document.getElementById('switcher');
sw.innerHTML = STATES.map(s => `<button class="switch-btn" data-id="${s}">${s}</button>`).join('');
sw.addEventListener('click', e => { if (e.target.dataset.id) render(e.target.dataset.id); });

render((location.hash || '#A1').slice(1));
window.addEventListener('hashchange', () => render((location.hash||'#A1').slice(1)));
</script>
</body>
</html>
