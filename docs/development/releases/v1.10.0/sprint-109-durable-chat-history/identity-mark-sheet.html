<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archived conversation identity-mark exploration — round 2</title>
  <style>
    @font-face {
      font-family: "Sofia Sans";
      src: url("../../../../../extensions/ritemark/media/fonts/SofiaSans-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --r-surface: #ffffff;
      --r-surface-muted: #f8fafc;
      --r-surface-soft: #f1f5f9;
      --r-hairline: #e2e8f0;
      --r-hairline-strong: #cbd5e1;
      --r-ink-strong: #1e1b4b;
      --r-ink-body: #475569;
      --r-ink-muted: #64748b;
      --r-ink-faint: #94a3b8;
      --r-accent: #4338ca;
      --r-accent-deep: #3730a3;
      --r-accent-soft: #e0e7ff;
      --r-ring: rgba(67, 56, 202, .1);
      --r-shadow-sm: 0 1px 2px rgba(30, 27, 75, .06), 0 1px 3px rgba(30, 27, 75, .04);
      --r-shadow-md: 0 4px 6px -1px rgba(30, 27, 75, .08), 0 2px 4px -2px rgba(30, 27, 75, .06);
      --r-shadow-indigo: 0 4px 6px -1px rgba(67, 56, 202, .25);
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --r-surface: #1e1b4b;
      --r-surface-muted: #191635;
      --r-surface-soft: #251f5c;
      --r-hairline: #3730a3;
      --r-hairline-strong: #4338ca;
      --r-ink-strong: #f8fafc;
      --r-ink-body: #c7d2fe;
      --r-ink-muted: #94a3b8;
      --r-ink-faint: #64748b;
      --r-accent: #818cf8;
      --r-accent-deep: #6366f1;
      --r-accent-soft: rgba(129, 140, 248, .16);
      --r-ring: rgba(129, 140, 248, .25);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--r-surface-muted);
      color: var(--r-ink-strong);
      font-family: "Sofia Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button:focus-visible, input:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--r-ring);
    }

    .sheet-header {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 64px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--r-hairline);
      background: color-mix(in srgb, var(--r-surface) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .header-copy { min-width: 0; }
    .header-copy h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
    .header-copy p { margin: 2px 0 0; color: var(--r-ink-muted); font-size: 12px; }
    .header-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--r-ink-body);
      cursor: pointer;
      user-select: none;
    }

    .switch input { width: 16px; height: 16px; accent-color: var(--r-accent); }

    .theme-button {
      min-width: 46px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--r-ink-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .theme-button:hover { background: var(--r-surface-soft); color: var(--r-ink-strong); }

    .sheet-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 20px;
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 20px 24px 48px;
    }

    .mark-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(112px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .mark-card {
      position: relative;
      min-width: 0;
      min-height: 146px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
      padding: 18px 12px 12px;
      border: 1px solid var(--r-hairline);
      border-radius: 10px;
      background: var(--r-surface);
      color: var(--r-ink-strong);
      box-shadow: var(--r-shadow-sm);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }

    .mark-card:hover {
      border-color: var(--r-hairline-strong);
      box-shadow: var(--r-shadow-md);
      transform: translateY(-1px);
    }

    .mark-card[aria-pressed="true"] {
      border-color: var(--r-accent);
      background: var(--r-accent-soft);
      box-shadow: 0 0 0 2px var(--r-ring), var(--r-shadow-sm);
    }

    .mark-preview {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
    }

    .mark-preview svg { width: 64px; height: 64px; display: block; overflow: visible; }
    .mark-id { color: var(--r-ink-muted); font-size: 12px; font-weight: 600; letter-spacing: .7px; }

    .selection-state {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--r-accent);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .mark-card[aria-pressed="true"] .selection-state { opacity: 1; transform: translateY(0); }

    .basket {
      position: sticky;
      top: 84px;
      align-self: start;
      min-height: 220px;
      overflow: hidden;
      border: 1px solid var(--r-hairline);
      border-radius: 10px;
      background: var(--r-surface);
      box-shadow: var(--r-shadow-sm);
    }

    .basket-head {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--r-hairline);
    }

    .basket-title { font-size: 15px; font-weight: 600; }
    .basket-count { margin-left: 6px; color: var(--r-ink-muted); font-variant-numeric: tabular-nums; }

    .basket-list {
      display: grid;
      gap: 2px;
      max-height: calc(100vh - 238px);
      overflow: auto;
      padding: 6px;
    }

    .basket-empty { padding: 28px 18px; color: var(--r-ink-muted); text-align: center; }

    .basket-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 4px 4px 4px 8px;
      border-radius: 4px;
    }

    .basket-row:hover { background: var(--r-surface-soft); }
    .basket-mark { width: 34px; height: 34px; display: grid; place-items: center; }
    .basket-mark svg { width: 30px; height: 30px; display: block; overflow: visible; }
    .basket-row-id { font-weight: 600; letter-spacing: .5px; }

    .remove-button {
      min-width: 48px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--r-ink-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .remove-button:hover { background: var(--r-surface-soft); color: var(--r-ink-strong); }

    .basket-actions {
      display: flex;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--r-hairline);
    }

    .button {
      min-height: 34px;
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      background: var(--r-surface-soft);
      color: var(--r-ink-strong);
      cursor: pointer;
      font-weight: 500;
    }

    .button:hover { background: var(--r-hairline); }
    .button.primary { flex: 1; background: var(--r-accent); color: #fff; box-shadow: var(--r-shadow-indigo); }
    .button.primary:hover { background: var(--r-accent-deep); }
    .button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .status {
      min-height: 20px;
      padding: 0 12px 10px;
      color: var(--r-ink-muted);
      font-size: 11px;
    }

    @media (max-width: 1180px) {
      .mark-grid { grid-template-columns: repeat(4, minmax(112px, 1fr)); }
    }

    @media (max-width: 820px) {
      .sheet-layout { grid-template-columns: 1fr; }
      .basket { position: static; order: -1; }
      .basket-list { max-height: none; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .mark-grid { grid-template-columns: repeat(3, minmax(96px, 1fr)); }
      .sheet-header { padding-inline: 16px; }
      .sheet-layout { padding-inline: 16px; }
    }

    @media (max-width: 520px) {
      .sheet-header { align-items: flex-start; flex-wrap: wrap; }
      .header-actions { width: 100%; margin-left: 0; justify-content: space-between; }
      .mark-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mark-card { min-height: 132px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="sheet-header">
    <div class="header-copy">
      <h1>Archived identity-mark exploration</h1>
      <p>Rejected for production on 2026-08-22 · Ritemark uses the shared Phosphor chat bubble instead</p>
    </div>
    <div class="header-actions">
      <label class="switch">
        <input type="checkbox" id="selected-only">
        <span>Selected only</span>
      </label>
      <button class="theme-button" id="theme-toggle" type="button" aria-label="Use dark theme">Dark</button>
    </div>
  </header>

  <main class="sheet-layout">
    <section class="mark-grid" id="mark-grid" aria-label="36 symmetric conversation identity mark candidates"></section>

    <aside class="basket" aria-label="Selected identity marks">
      <div class="basket-head">
        <span class="basket-title">Selected</span>
        <span class="basket-count" id="basket-count">0 / 36</span>
      </div>
      <div class="basket-list" id="basket-list"></div>
      <div class="basket-actions">
        <button class="button primary" id="copy-selection" type="button" disabled>Copy IDs</button>
        <button class="button" id="clear-selection" type="button" disabled>Clear</button>
      </div>
      <div class="status" id="selection-status" aria-live="polite">No marks selected.</div>
    </aside>
  </main>

  <script>
    const palettes = [
      ['#4F46E5', '#818CF8', '#C7D2FE', '#312E81'],
      ['#7C3AED', '#A78BFA', '#DDD6FE', '#5B21B6'],
      ['#2563EB', '#60A5FA', '#BFDBFE', '#1E40AF'],
      ['#0891B2', '#22D3EE', '#A5F3FC', '#155E75'],
      ['#0F766E', '#2DD4BF', '#99F6E4', '#115E59'],
      ['#16A34A', '#4ADE80', '#BBF7D0', '#166534'],
      ['#65A30D', '#A3E635', '#D9F99D', '#3F6212'],
      ['#D97706', '#FBBF24', '#FDE68A', '#92400E'],
      ['#EA580C', '#FB923C', '#FED7AA', '#9A3412'],
      ['#DC2626', '#F87171', '#FECACA', '#991B1B'],
      ['#9333EA', '#C084FC', '#E9D5FF', '#6B21A8'],
      ['#0284C7', '#38BDF8', '#BAE6FD', '#075985']
    ];

    const ns = 'http://www.w3.org/2000/svg';
    const storageKey = 'ritemark-conversation-identity-mark-selection-symmetry-v2';
    const marks = Array.from({ length: 36 }, (_, index) => ({
      id: `S${String(index + 1).padStart(2, '0')}`,
      family: index % 12,
      variant: Math.floor(index / 12),
      palette: palettes[(index * 7 + Math.floor(index / 4)) % palettes.length]
    }));

    function svgElement(name, attrs = {}) {
      const element = document.createElementNS(ns, name);
      Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, String(value)));
      return element;
    }

    function add(parent, name, attrs) {
      const element = svgElement(name, attrs);
      parent.appendChild(element);
      return element;
    }

    function radialEllipses(svg, count, cx, cy, distance, rx, ry, colors, rotation = 0) {
      for (let i = 0; i < count; i += 1) {
        const angle = rotation + (360 / count) * i;
        const radians = angle * Math.PI / 180;
        const x = cx + Math.cos(radians) * distance;
        const y = cy + Math.sin(radians) * distance;
        add(svg, 'ellipse', { cx: x, cy: y, rx, ry, fill: colors[i % colors.length], transform: `rotate(${angle + 90} ${x} ${y})` });
      }
    }

    function circleCluster(svg, circles, colors) {
      circles.forEach((circle, index) => add(svg, 'circle', {
        cx: circle[0], cy: circle[1], r: circle[2], fill: colors[index % colors.length], opacity: circle[3] ?? 1
      }));
    }

    function radialCircles(svg, count, distance, radius, colors, rotation = 0) {
      for (let i = 0; i < count; i += 1) {
        const angle = rotation + (360 / count) * i;
        const radians = angle * Math.PI / 180;
        add(svg, 'circle', {
          cx: 50 + Math.cos(radians) * distance,
          cy: 50 + Math.sin(radians) * distance,
          r: Array.isArray(radius) ? radius[i % radius.length] : radius,
          fill: colors[i % colors.length]
        });
      }
    }

    function radialTiles(svg, count, distance, width, height, radius, colors, rotation = 0, tilt = 45) {
      for (let i = 0; i < count; i += 1) {
        const angle = rotation + (360 / count) * i;
        const radians = angle * Math.PI / 180;
        const x = 50 + Math.cos(radians) * distance;
        const y = 50 + Math.sin(radians) * distance;
        add(svg, 'rect', {
          x: x - width / 2,
          y: y - height / 2,
          width,
          height,
          rx: radius,
          fill: colors[i % colors.length],
          transform: `rotate(${angle + tilt} ${x} ${y})`
        });
      }
    }

    function renderPattern(svg, mark) {
      const c = mark.palette;
      const v = mark.variant;
      switch (mark.family) {
        case 0: {
          const count = [6, 8, 10][v];
          radialEllipses(svg, count, 50, 50, [21, 23, 24][v], [8, 7, 6][v], [18, 17, 16][v], [c[1]], v * 9);
          add(svg, 'circle', { cx: 50, cy: 50, r: [13, 12, 11][v], fill: c[0] });
          break;
        }
        case 1: {
          const count = [6, 8, 10][v];
          radialCircles(svg, count, [27, 28, 29][v], [10, 9, 8][v], [c[0], c[1]], v * 9);
          add(svg, 'circle', { cx: 50, cy: 50, r: [10, 11, 9][v], fill: c[3] });
          break;
        }
        case 2:
          radialEllipses(svg, 3, 50, 50, [19, 21, 23][v], [16, 14, 13][v], [28, 27, 25][v], [c[1]], [0, 20, 40][v]);
          add(svg, 'circle', { cx: 50, cy: 50, r: [11, 10, 9][v], fill: c[3] });
          break;
        case 3: {
          const count = [6, 8, 10][v];
          radialTiles(svg, count, [23, 25, 27][v], [19, 17, 15][v], [19, 17, 15][v], [5, 5, 4][v], [c[0], c[1]], [30, 22.5, 18][v], 45);
          add(svg, 'circle', { cx: 50, cy: 50, r: [9, 8, 7][v], fill: c[3] });
          break;
        }
        case 4: {
          const count = [5, 6, 8][v];
          radialEllipses(svg, count, 50, 50, 24, [7, 7, 6][v], [17, 16, 15][v], [c[1]], v * 7);
          radialEllipses(svg, count, 50, 50, 12, [4, 4, 3.5][v], [10, 9, 8][v], [c[2]], v * 7 + 180 / count);
          add(svg, 'circle', { cx: 50, cy: 50, r: [8, 7, 6][v], fill: c[0] });
          break;
        }
        case 5:
          radialEllipses(svg, [4, 3, 6][v], 50, 50, [20, 19, 23][v], [17, 18, 12][v], [27, 29, 23][v], [c[1]], [45, 0, 30][v]);
          add(svg, 'circle', { cx: 50, cy: 50, r: [12, 11, 10][v], fill: c[3] });
          break;
        case 6: {
          const count = [8, 10, 12][v];
          radialCircles(svg, count, [28, 29, 30][v], [7, 6.5, 6][v], [c[0]], [0, 9, 0][v]);
          radialCircles(svg, count, [17, 18, 19][v], [4, 4, 3.5][v], [c[2]], [180 / count, 9 + 180 / count, 180 / count][v]);
          add(svg, 'circle', { cx: 50, cy: 50, r: [8, 7, 6][v], fill: c[3] });
          break;
        }
        case 7: {
          const count = [5, 7, 9][v];
          radialTiles(svg, count, [24, 26, 28][v], [15, 13, 11][v], [25, 22, 19][v], 6, [c[0]], [18, 0, 20][v], 90);
          add(svg, 'circle', { cx: 50, cy: 50, r: [12, 10, 9][v], fill: c[2] });
          break;
        }
        case 8: {
          const offset = [17, 18, 19][v];
          [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([dx, dy], index) => {
            const x = 50 + dx * offset;
            const y = 50 + dy * offset;
            add(svg, 'rect', { x: x - 11, y: y - 11, width: 22, height: 22, rx: [5, 7, 4][v], fill: index % 2 ? c[1] : c[0], transform: `rotate(${[45, 0, 45][v]} ${x} ${y})` });
          });
          if (v === 2) add(svg, 'circle', { cx: 50, cy: 50, r: 6, fill: c[3] });
          break;
        }
        case 9: {
          const count = [6, 8, 10][v];
          radialEllipses(svg, count, 50, 50, [24, 25, 26][v], [6, 5.5, 5][v], [15, 14, 13][v], [c[1]], [0, 22.5, 0][v]);
          radialCircles(svg, count, [31, 32, 33][v], [4.5, 4, 3.5][v], [c[3]], [180 / count, 22.5 + 180 / count, 180 / count][v]);
          add(svg, 'circle', { cx: 50, cy: 50, r: [9, 8, 7][v], fill: c[0] });
          break;
        }
        case 10: {
          const count = [5, 7, 9][v];
          radialEllipses(svg, count, 50, 50, [19, 21, 23][v], [10, 8, 7][v], [21, 19, 17][v], [c[0]], [0, 12, 0][v]);
          add(svg, 'circle', { cx: 50, cy: 50, r: [13, 11, 10][v], fill: c[2] });
          add(svg, 'circle', { cx: 50, cy: 50, r: [7, 6, 5][v], fill: c[3] });
          break;
        }
        case 11: {
          const count = [6, 8, 10][v];
          radialCircles(svg, count, [30, 31, 32][v], [7, 6, 5.5][v], [c[1]], v * 6);
          radialCircles(svg, count, [17, 18, 19][v], [5, 4.5, 4][v], [c[0]], v * 6 + 180 / count);
          add(svg, 'circle', { cx: 50, cy: 50, r: [10, 9, 8][v], fill: c[3] });
          break;
        }
      }
    }

    function createMarkSvg(mark, label) {
      const svg = svgElement('svg', { viewBox: '0 0 100 100', role: label ? 'img' : 'presentation', 'aria-hidden': label ? 'false' : 'true' });
      if (label) {
        const title = svgElement('title');
        title.textContent = label;
        svg.appendChild(title);
      }
      renderPattern(svg, mark);
      return svg;
    }

    function readSelection() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return new Set(saved.filter((id) => marks.some((mark) => mark.id === id)));
      } catch {
        return new Set();
      }
    }

    const selected = readSelection();
    const grid = document.getElementById('mark-grid');
    const basketList = document.getElementById('basket-list');
    const basketCount = document.getElementById('basket-count');
    const copyButton = document.getElementById('copy-selection');
    const clearButton = document.getElementById('clear-selection');
    const status = document.getElementById('selection-status');
    const selectedOnly = document.getElementById('selected-only');
    const themeToggle = document.getElementById('theme-toggle');

    function persistSelection() {
      localStorage.setItem(storageKey, JSON.stringify([...selected]));
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function toggleMark(id) {
      if (selected.has(id)) {
        selected.delete(id);
        setStatus(`${id} removed.`);
      } else {
        selected.add(id);
        setStatus(`${id} selected.`);
      }
      persistSelection();
      render();
    }

    function renderGrid() {
      grid.replaceChildren();
      const visible = selectedOnly.checked ? marks.filter((mark) => selected.has(mark.id)) : marks;
      if (!visible.length) {
        const empty = document.createElement('p');
        empty.className = 'basket-empty';
        empty.textContent = 'No selected marks yet.';
        grid.appendChild(empty);
        return;
      }
      visible.forEach((mark) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'mark-card';
        button.setAttribute('aria-pressed', String(selected.has(mark.id)));
        button.setAttribute('aria-label', `${selected.has(mark.id) ? 'Remove' : 'Select'} ${mark.id}`);

        const state = document.createElement('span');
        state.className = 'selection-state';
        state.textContent = 'Selected';

        const preview = document.createElement('span');
        preview.className = 'mark-preview';
        preview.appendChild(createMarkSvg(mark, `${mark.id} abstract conversation identity mark`));

        const id = document.createElement('span');
        id.className = 'mark-id';
        id.textContent = mark.id;

        button.append(state, preview, id);
        button.addEventListener('click', () => toggleMark(mark.id));
        grid.appendChild(button);
      });
    }

    function renderBasket() {
      basketList.replaceChildren();
      const selectedMarks = [...selected].map((id) => marks.find((mark) => mark.id === id)).filter(Boolean);
      basketCount.textContent = `${selectedMarks.length} / 36`;
      copyButton.disabled = selectedMarks.length === 0;
      clearButton.disabled = selectedMarks.length === 0;

      if (!selectedMarks.length) {
        const empty = document.createElement('div');
        empty.className = 'basket-empty';
        empty.textContent = 'Click a mark to add it here.';
        basketList.appendChild(empty);
        return;
      }

      selectedMarks.forEach((mark) => {
        const row = document.createElement('div');
        row.className = 'basket-row';

        const preview = document.createElement('span');
        preview.className = 'basket-mark';
        preview.appendChild(createMarkSvg(mark, ''));

        const id = document.createElement('span');
        id.className = 'basket-row-id';
        id.textContent = mark.id;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-button';
        remove.setAttribute('aria-label', `Remove ${mark.id}`);
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => toggleMark(mark.id));

        row.append(preview, id, remove);
        basketList.appendChild(row);
      });
    }

    function render() {
      renderGrid();
      renderBasket();
    }

    async function copySelection() {
      const text = [...selected].join(', ');
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }
      setStatus(`Copied ${selected.size} ID${selected.size === 1 ? '' : 's'}: ${text}`);
    }

    copyButton.addEventListener('click', copySelection);
    clearButton.addEventListener('click', () => {
      selected.clear();
      persistSelection();
      setStatus('Selection cleared.');
      render();
    });
    selectedOnly.addEventListener('change', renderGrid);
    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      themeToggle.textContent = dark ? 'Light' : 'Dark';
      themeToggle.setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
    });

    render();
  </script>
</body>
</html>
