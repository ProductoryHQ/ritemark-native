<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Editor (harness)</title>
  <!-- VS Code's webview default styles (vscode/src/vs/workbench/contrib/webview/browser/pre/index.html, _defaultStyles), trimmed to what applies here -->
  <style id="_defaultStyles">
    @layer vscode-default {
      html { scrollbar-color: var(--vscode-scrollbarSlider-background) var(--vscode-editor-background); }
      body {
        overscroll-behavior-x: none;
        background-color: transparent;
        color: var(--vscode-editor-foreground);
        font-family: var(--vscode-font-family);
        font-weight: var(--vscode-font-weight);
        font-size: var(--vscode-font-size);
        margin: 0;
        padding: 0 20px;
      }
      a:focus, input:focus, select:focus, textarea:focus { outline: 1px solid -webkit-focus-ring-color; outline-offset: -1px; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-corner { background-color: var(--vscode-editor-background); }
      ::-webkit-scrollbar-thumb { background-color: var(--vscode-scrollbarSlider-background); }
    }
  </style>
  <!-- The theme's colours as VS Code sets them on <html> (generated by shoot.mjs from themes/ritemark-light.json) -->
  <link rel="stylesheet" href="theme-light.css">
  <!-- FlowEditorProvider.getHtml()'s own style, verbatim -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--vscode-font-family);
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
    }
  </style>
</head>
<body class="vscode-light" data-vscode-theme-kind="vscode-light" data-vscode-theme-id="Ritemark Light">
  <div id="root" data-editor-type="flow"></div>
  <script src="flow.js"></script>
  <script src="host-stub.js"></script>
  <!-- The committed bundle, not a copy: the worktree root is eight folders up -->
  <script src="../../../../../../../../extensions/ritemark/media/webview.js"></script>
</body>
</html>
