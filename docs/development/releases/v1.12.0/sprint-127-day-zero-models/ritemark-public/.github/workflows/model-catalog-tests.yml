name: Model catalog tests

# Publisher unit tests and a feed validation. Runs pull-request code, so it
# gets no secrets and read-only permissions.

on:
  pull_request:
    paths:
      - 'scripts/model-catalog/**'
      - 'feeds/model-catalog*.json'
      - '.github/workflows/model-catalog-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/model-catalog/**'
      - 'feeds/model-catalog*.json'
      - '.github/workflows/model-catalog-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Unit tests
        run: node --test 'scripts/model-catalog/*.test.mjs'

      - name: Validate the feed
        run: node scripts/model-catalog/validate.mjs
