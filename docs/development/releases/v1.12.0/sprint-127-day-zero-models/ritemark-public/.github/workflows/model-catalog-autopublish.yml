name: Model catalog autopublish

# Adds new Anthropic models to feeds/model-catalog.json within minutes of
# Anthropic listing them (Ritemark Sprint 127, R4). How it works and how to
# switch it off: feeds/README.md.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the canary, but write and push nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-catalog-autopublish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.MODEL_CATALOG_AUTOPUBLISH == 'on' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Restore publisher state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .catalog-state
          key: model-catalog-state-${{ github.run_id }}
          restore-keys: model-catalog-state-

      - name: Publish new Anthropic models
        id: publish
        env:
          MODEL_CATALOG_AUTOPUBLISH: ${{ vars.MODEL_CATALOG_AUTOPUBLISH }}
          MODEL_CATALOG_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MODEL_CATALOG_ANTHROPIC_API_KEY: ${{ secrets.MODEL_CATALOG_ANTHROPIC_API_KEY }}
        run: node scripts/model-catalog/autopublish.mjs

      - name: Commit and push the feed
        if: steps.publish.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE_FILE: ${{ steps.publish.outputs.commit_message_file }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/model-catalog.json feeds/model-catalog.config.json
          git commit --quiet --file "$COMMIT_MESSAGE_FILE"
          git fetch --quiet origin main
          git rebase origin/main
          node scripts/model-catalog/validate.mjs --base origin/main
          git push --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Save publisher state
        if: always() && steps.publish.outputs.state_changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .catalog-state
          key: model-catalog-state-${{ github.run_id }}

      - name: Report failed canaries
        if: steps.publish.outputs.failed == 'true'
        env:
          FAILED_MODELS: ${{ steps.publish.outputs.failed_models }}
        run: |
          echo "::error title=Model catalog canary failed::${FAILED_MODELS} did not pass the canary and was not published. The publish step log has the reason; the next try is after the cooldown."
          exit 1
